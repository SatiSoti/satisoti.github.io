const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.random()*(b-a);

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function man(v){const n=Math.round(v);if(Math.abs(n)>=10000)return(n/10000).toFixed(2)+'億円';return n.toLocaleString()+'万円'}
function bu(n){n=Math.round(n);if(n>=10000)return(n/10000).toFixed(n>=100000?0:1)+'万部';return n.toLocaleString()+'部'}
function nin(n){return bu(n).replace('部','人')}
function hash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
function grade(g,t){const k=g+'|'+t;if(S&&S.fixG&&S.fixG[k]!=null)return S.fixG[k];if(GREAT.includes(k))return 3;if(GOOD.includes(k))return 2;if(BADC.includes(k))return 0;const h=hash(k)%100;return h<14?0:h<62?1:h<88?2:3}
function genTitle(g,t){const a=pick(THEME_W[t]),b=pick(GENRE_W[g]);return a+b}
const yearOf=w=>START_YEAR+Math.floor((w-1)/WPY), monthOf=w=>Math.floor(((w-1)%WPY)/4)+1;
function dateStr(w){return`${yearOf(w)}年 ${monthOf(w)}月 第${(w-1)%4+1}週`}
function shortDate(w){return`${String(yearOf(w)).slice(2)}年${monthOf(w)}月`}
function fitOf(dir,ideal){let d=0;for(let i=0;i<4;i++)d+=Math.abs(dir[i]-ideal[i]);return clamp(1-d/16,0,1)}
function genreDemo(mk,g){const d=MKT[mk].demo;if(d==='全年齢')return 1;return G_DEMO[d][g]}
function eRate(y){return y<2010?0:Math.min(.45,.04*(y-2009))}
function poolRate(mk,y){if(mk==='Web')return y<2010?1:y<2020?1.12:1.05;if(mk==='アプリ')return y<2013?1:y<2020?1.22:1.08;return y<2005?1:y<2009?.98:y<2016?.95:.955}
function rivalMagName(mk){const w=pick(MAGW);const M=MKT[mk];return mk==='Web'?`${w}コミック`:mk==='アプリ'?`マンガ${w}`:`${M.freq}${M.demo}${w}`}

function jitter(ideal){const d=[...ideal];for(let i=0;i<2;i++){const a=RI(0,3),b=RI(0,3);if(d[a]>0&&d[b]<5){d[a]--;d[b]++}}return d}

/* ================= 参照・計算 ================= */
const artist=id=>S.artists.find(a=>a.id===id);
const editor=id=>S.editors.find(e=>e.id===id);
const ser=id=>S.series.find(s=>s.id===id);
const mag=id=>S.mags.find(m=>m.id===id);
const desks=()=>OFFICES[S.office].desks;
const activeIn=m=>S.series.filter(s=>!s.ended&&s.mid===m.id);
const freeA=()=>S.artists.filter(a=>!a.sid&&!a.oneshot);
const eLoad=e=>S.series.filter(s=>!s.ended&&s.eid===e.id).length;
const eCap=e=>3+Math.floor(e.lv/5);
const eOver=e=>{const l=eLoad(e),c=eCap(e);return l>c?c/l:1};
const artistCap=()=>S.mags.length*SLOTS+6;
function crowd(g,demo){let k=1;for(const e of S.events)if(e.kind==='crowd'&&e.genre===g&&(e.demo===demo||demo==='全年齢'))k*=e.mult;return k}
function pres(mk){let k=1;for(const e of S.events)if(e.kind==='pres'&&e.mk===mk)k*=e.mult;const now=rivalSum(mk),init=S.rivals.reduce((t,r)=>t+r.init[mk],0);return k*(init>0?Math.pow(now/init,.5):1)}
function demandMult(){let k=1;for(const e of S.events)if(e.kind==='demand')k*=e.mult;return k}
function updKanban(s){s.kanban=Math.round(clamp(s.pop*.5+50*Math.min(1,Math.sqrt(s.fans/800000)),0,100))}
function mkOf(s){const m=mag(s.mid);return m?m.mk:(s.mk||MK_ORDER[0])}
function appeal(s){return Math.pow(s.kanban/10,2)*(s.anime>0?1.4:1)*(s.chapters===0?.3:1)}
function magPower(m){const L=activeIn(m);let sum=0;L.forEach(s=>sum+=appeal(s));return sum*m.brand*(m.promo?m.promo.m:1)*(.6+.4*Math.min(1,L.length/SLOTS))+2}
function rivalSum(mk){return S.rivals.reduce((t,r)=>t+r.p[mk],0)}
function myPower(mk){return S.mags.filter(m=>m.mk===mk).reduce((t,m)=>t+magPower(m),0)}
function shareOf(m){return magPower(m)/(myPower(m.mk)+rivalSum(m.mk)+(MKT[m.mk].base||0))}
function stale(s,M){const th=M.freq==='週刊'?150:60,rt=M.freq==='週刊'?.0015:.004;return Math.max(.75,1-Math.max(0,s.chapters-th)*rt)}
function seriesCap(s){return S.pool[mkOf(s)]*(s.anime>0||s.animeDone?1.3:.5)*(s.movieDone?1.5:1)}
function volBase(s){return s.fans*.35/pres(mkOf(s))*(s.anime>0?2.2:1)*(s.movie>0?1.5:1)*(s.promo?s.promo.m:1)*demandMult()}
function weeklyFixed(){return OFFICES[S.office].rent+S.editors.reduce((t,e)=>t+e.salary,0)+S.mags.reduce((t,m)=>t+MKT[m.mk].up,0)+S.series.filter(s=>!s.ended).reduce((t,s)=>t+s.asst*10,0)}
function chapterQ(s,a,m,raw){
  const M=MKT[m.mk];const fm=fitOf(s.dir,M.ideal),fg=fitOf(s.dir,G_IDEAL[s.genre]);const g=grade(s.genre,s.theme);
  const mult=(.75+.12*fm+.13*fg)*CMULT[g]*Math.sqrt(genreDemo(m.mk,s.genre))*(S.trend===s.genre?1.08:1)*crowd(s.genre,M.demo)*(s.meet?1.12:1)*stale(s,M)*(1-Math.min(.3,s.miss*.03));
  return clamp(100*(1-Math.exp(-raw*mult/190)),1,99)}
function estQ(a,m,g,t,dir){const M=MKT[m.mk];const raw=(a.st*.3+a.art*.3+a.ch*.25+a.dir*.15)*2.1;const fm=fitOf(dir,M.ideal),fg=fitOf(dir,G_IDEAL[g]);
  const mult=(.75+.12*fm+.13*fg)*CMULT[grade(g,t)]*Math.sqrt(genreDemo(m.mk,g))*(S.trend===g?1.08:1);return clamp(100*(1-Math.exp(-raw*mult/190)),1,99)}
function ranking(){
  const mine=S.mags.reduce((t,m)=>t+m.lastSold,0);
  const rs=S.rivals.map(r=>({n:r.name,col:r.col,v:MK_ORDER.reduce((t,k)=>{const d=rivalSum(k)+myPower(k)+(MKT[k].base||0);return t+(r.p[k]>0&&d>0?S.pool[k]*r.p[k]/d:0)},0)}));
  return[{n:S.co,v:mine,me:true,col:'var(--accent)'},...rs].sort((a,b)=>b.v-a.v)}

function phaseOf(s){const f=s.prog<0?0:s.prog/s.total;return f<.3?0:f<.7?1:2}
const PHASE=['ネーム','作画','仕上げ'];
const PW=[{st:.5,ch:.35,dir:.1,art:.05},{art:.55,ch:.3,dir:.1,st:.05},{dir:.5,art:.25,st:.15,ch:.1}];
function wpick(w){let r=Math.random()*Object.values(w).reduce((a,b)=>a+b,0);for(const k in w){r-=w[k];if(r<=0)return k}return Object.keys(w)[0]}
function dirBias(d){return{st:1+d[1]*.06+d[3]*.03,art:1+d[2]*.05,ch:1+d[0]*.04+d[2]*.04,dir:1+d[0]*.05+d[3]*.04}}
function subtick(){
  S.series.forEach(s=>{
    if(s.ended)return;const a=artist(s.aid);if(!a)return;const e=s.eid?editor(s.eid):null;const m=mag(s.mid);const M=MKT[m.mk];
    if(s.hiatus||s.resting){a.stam=Math.min(a.stamMax,a.stam+(s.resting?5:4));if(s.resting&&a.stam>=a.stamMax*.8){s.resting=false;log(`${a.name}が復帰。『${s.title}』の連載を再開する。`)}return}
    if(a.slump>0){a.slump--;if(Math.random()<.3)float('スランプ…','--muted',a.id);if(a.slump===0)log(`${a.name}がスランプを抜け出した!`,'good');s.prog+=.25;return}
    const ph=phaseOf(s);const wb=dirBias(s.dir);const w={};for(const k in PW[ph])w[k]=PW[ph][k]*wb[k];
    const tired=a.stam<a.stamMax*.15?.5:1;const n=1+(Math.random()<a.speed/140?1:0);
    for(let j=0;j<n;j++){const k=wpick(w);const v=Math.max(1,Math.round(a[k]*R(.5,1.2)/8*tired*(s.genre===a.fav?1.1:1)));s.cur[k]+=v;float(`${PS[k]}+${v}`,PTOK[k],a.id);a.exp+=v*.2}

/* ================= アクション ================= */
function spend(v){if(S.funds<v){log('資金が足りない。','badl');renderSlow();return false}money(-v);return true}
function spendNeta(v){if(S.neta<v){log('ネタが足りない。連載が進むとたまる。','badl');renderSlow();return false}S.neta-=v;return true}
const ACT={
  plan(mid){queue({type:'plan',mid:+mid})},

  found(){queue({type:'found'})},
  appdev(){if(S.appDev||S.mags.some(m=>m.mk==='アプリ'))return;if(!spend(MKT.アプリ.found))return;S.appDev={left:26};log('自社マンガアプリの開発に着手! 完成まで26週。','good');renderSlow()},
  mpromo(mid){queue({type:'mpromo',mid:+mid})},
  pmode(mid,v){mag(+mid).printMode=+v;renderSlow()},
  close(mid){queue({type:'close',mid:+mid})},
  hireE(t){if(S.editors.length>=desks()){log('編集者の席が足りない。会社タブでオフィスを移転しよう。','badl');renderSlow();return}const h=HIRE_E[+t];if(!spend(h.c))return;
    queue({type:'hireE',cands:[0,1,2].map(()=>mkEditor(clamp(h.t+(Math.random()<.2?1:0)-(Math.random()<.3?1:0),0,2)))})},
  contest(){if(S.artists.length>=artistCap()){log('作家が多すぎる。雑誌を増やせば枠が広がる。','badl');renderSlow();return}if(S.contestCool>0)return;if(!spend(300))return;S.contestCool=24;
    const sp=S.editors.reduce((t,e)=>Math.max(t,e.scout),0);queue({type:'hire',src:'新人賞',cands:[0,1,2].map(()=>mkArtist(Math.random()<sp/120?1:0))})},
  scout(){if(S.artists.length>=artistCap()){log('作家が多すぎる。','badl');renderSlow();return}if(S.funds<2000){log('スカウトには500万円のほかに契約金(1,500万円〜)が要る。','badl');renderSlow();return}if(!spend(500))return;const c=[mkArtist(2),mkArtist(Math.random()<S.rep/150?2:1)];c.forEach(a=>a.sign=Math.round((a.st+a.art+a.ch+a.dir)*8+a.lv*60));queue({type:'hire',src:'スカウト',cands:c})},
  trainE(id,k){const e=editor(+id);if(e[k]>=100){log(`${e.name}の${{meet:'打ち合わせ力',scout:'発掘力',promo:'プロモーション力'}[k]}は研修ではこれ以上伸びない。`);renderSlow();return}if(!spend(trainCost(e,k)))return;e[k]=Math.min(100,e[k]+RI(2,5));e.salary=salaryOf(e);log(`${e.name}が研修を受けた(${{meet:'打ち合わせ力',scout:'発掘力',promo:'プロモーション力'}[k]}アップ)`,'good');renderSlow()},
  fireA(id){queue({type:'fire',who:'a',id:+id})},
  fireE(id){queue({type:'fire',who:'e',id:+id})},
  oneshot(aid){queue({type:'oneshot',aid:+aid})},
  office(){const n=OFFICES[S.office+1];if(!n)return;if(!spend(n.cost))return;S.office++;log(`${n.n}へ移転! 編集者の席が${n.desks}に。`,'good');renderSlow()},
  unlock(kind,v){const c=kind==='G'?20:12;if(!spendNeta(c))return;S[kind].push(v);log(`新しい${kind==='G'?'ジャンル':'テーマ'}「${v}」を研究した!`,'good');renderSlow()},
  policy(v){S.policy=+v;renderSlow()},
  confirm(v){S.confirmAll=v==='1';renderSlow()},
  tab(t){TAB=t;renderSlow()},
  speed(v){speed=+v;renderTop()},
  theme(){const r=document.documentElement;const cur=r.getAttribute('data-theme');const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.setAttribute('data-theme',dark?'light':'dark');try{localStorage.setItem('cpk-theme',dark?'light':'dark')}catch(e){}},

function eLine(e){return`<span class="num">打${e.meet} 発${e.scout} 宣${e.promo}</span>`}
function gMark(v){return v>=1.15?'◎':v>=1.05?'○':v>=.97?'△':'×'}
function fitMark(f){return f>=.85?'◎':f>=.7?'○':f>=.5?'△':'×'}

   <div class="dirs">${DIRS.map((d,i)=>`<span>${d}</span><button class="sub" data-dm="${i}" ${st.dir[i]<=0?'disabled':''} aria-label="${d}を下げる">−</button><span class="pips">${[0,1,2,3,4].map(j=>`<i class="${j<st.dir[i]?'on':''}"></i>`).join('')}</span><button class="sub" data-dp="${i}" ${st.dir[i]>=5||used>=10?'disabled':''} aria-label="${d}を上げる">＋</button>`).join('')}</div></div>`}

  lineup(q){
    const mk=q.mk,M=MKT[mk];

      q.cands=[...ex,...fr,...c.nw];q.sel=[];
    }
    const draw=()=>{
      const cnt=q.sel.length;
      const card=(c,i)=>{const sel=q.sel.includes(i);let head,body;
        if(c.kind==='ex'){const s=ser(c.sid);const a=artist(s.aid);const m=mag(s.mid);head=`『${esc(s.title)}』 <span class="tag">移籍</span>`;body=`${esc(m.name)}から ・ 人気${Math.round(s.pop)} 看板度${s.kanban} ・ ${s.genre}×${s.theme} ${gMark(genreDemo(mk,s.genre))} ・ ${esc(a.name)}${MKT[m.mk].demo!==M.demo&&M.demo!=='全年齢'?' ・ 読者層が変わるので人気-5':''}`}
        else{const a=c.kind==='free'?artist(c.aid):c.a;head=`『${esc(c.title)}』 <span class="tag ${c.kind==='new'?'blue':''}">${c.kind==='new'?'創刊持ち込み':'新企画'}</span>`;body=`${c.g}×${c.t} ${gMark(genreDemo(mk,c.g))}${S.known[c.g+'|'+c.t]?' '+CNAME[grade(c.g,c.t)]:''} ・ ${esc(a.name)} Lv${a.lv} ${aLine(a)} ・ 原稿料 ${a.fee}万/P`}
        return`<button class="cand ${sel?'sel':''}" data-i="${i}"><span class="cb">${sel?'✓':''}</span><span><b>${head}</b><small>${body}</small></span></button>`};
      const groups=[['既存の連載を移籍',c=>c.kind==='ex'],['手の空いた作家の企画',c=>c.kind==='free'],['創刊記念 持ち込み',c=>c.kind==='new']];

       ${groups.map(([t,f])=>{const list=q.cands.map((c,i)=>[c,i]).filter(([c])=>f(c));return list.length?`<div class="sec">${t}</div><div class="cands">${list.map(([c,i])=>card(c,i)).join('')}</div>`:''}).join('')}
       <div class="foot"><button class="sub" id="no">${q.free?'あとで決める':'やめる'}</button><button id="go" ${cnt===SLOTS?'':'disabled'}>${cnt===SLOTS?'この'+SLOTS+'作で創刊する':`あと${SLOTS-cnt}作選ぶ`}${q.free?'':`(${man(M.found)})`}</button></div>`,true);
      on('[data-i]',el=>{const i=+el.dataset.i;if(q.sel.includes(i))q.sel=q.sel.filter(x=>x!==i);else if(q.sel.length<SLOTS)q.sel.push(i);draw()});

        [...q.sel].forEach(i=>{const c=q.cands[i];
          if(c.kind==='ex'){const s=ser(c.sid);if(s&&!s.ended)transfer(s,m,true)}
          else{let a;if(c.kind==='free')a=artist(c.aid);else{a=c.a;S.artists.push(a)}if(!a||a.sid)return;const e=es();const s=mkSeries(a,m,c.g,c.t,c.title,c.dir,e?e.id:null);s.prog=-s.total}});

     ${segs.length?`<div class="share">${segs.map(x=>`<span style="width:${x.v/tt*100}%;background:${x.c};color:${x.fg}" title="${esc(x.n)}">${x.v/tt>.12?Math.round(x.v/tt*100)+'%':''}</span>`).join('')}</div><div class="legend">${segs.map(x=>`<span><i style="background:${x.c}"></i>${esc(x.n)}${x.m?`『${esc(x.m)}』`:''}</span>`).join('')}</div>`:'<p class="muted" style="margin:0">まだ誰も参入していない。</p>'}
     ${crowdE.length?`<div class="k warn">競合: ${crowdE.map(e=>e.genre).join('、')}が他社に押され気味</div>`:''}</section>`}).join('')}</div>
  <section class="card koma"><h2>ライバル動向</h2><div class="lst">${S.news.length?S.news.map(n=>`<div><span class="k">${shortDate(n.w)}</span> ${esc(n.t)}</div>`).join(''):'<span class="muted">まだ大きな動きはない。</span>'}</div></section>`;
}
function spark(){const h=S.hist;if(h.length<2)return'<p class="muted">数週間たつと資金の推移が表示される。</p>';
  const W=600,H=110,P=6;const vals=h.map(x=>x.funds);const mn=Math.min(0,...vals),mx=Math.max(...vals,1);
  const X=i=>P+i*(W-2*P)/(h.length-1),Y=v=>H-P-(v-mn)/(mx-mn)*(H-2*P);const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="資金の推移"><line x1="${P}" x2="${W-P}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)" stroke-dasharray="4 4"/><polygon points="${X(0)},${Y(mn)} ${pts} ${X(h.length-1)},${Y(mn)}" fill="var(--accent)" opacity=".35"/><polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="2.5"/><circle cx="${X(h.length-1)}" cy="${Y(vals[vals.length-1])}" r="4" fill="var(--ink)"/></svg><div class="row k" style="justify-content:space-between"><span>${h.length}週前</span><span>最高 ${man(mx)}</span><span>今週</span></div>`}
function vCo(){
  const last=S.hist[S.hist.length-1]||{rev:0,cost:0};const nx=OFFICES[S.office+1];
  const lockG=GENRES.filter(g=>!S.G.includes(g)),lockT=THEMES.filter(t=>!S.T.includes(t));
  return`<div class="grid2"><section class="card koma"><h2>経営状況</h2>
   <div class="kv"><div><span class="k">先週の収入</span><b class="good">${man(last.rev)}</b></div><div><span class="k">先週の支出</span><b class="bad">${man(last.cost)}</b></div><div><span class="k">固定費/週</span><b>${man(weeklyFixed())}</b></div><div><span class="k">評判</span><b>${S.rep}</b></div></div>${spark()}<p class="k" style="margin:0">評判は受賞・アニメ化・円満完結で上がり、打ち切り・休刊・引き抜きで下がる。高いと持ち込みが増え、スカウトや引き留めが有利になる。</p></section>
   <section class="card koma"><h2>オフィス</h2><p style="margin:0">${OFFICES[S.office].n} ・ 編集者の席${desks()} ・ 家賃 ${man(OFFICES[S.office].rent)}/週</p>
   <div class="row">${nx?`<button data-act="office" ${S.funds<nx.cost?'disabled':''}>${nx.n}へ移転 ${man(nx.cost)}</button>`:'<span class="k">最高のオフィス</span>'}<button class="sub" data-act="theme">明暗切替</button><button class="danger" data-act="newgame">最初から</button></div></section>
   <section class="card koma"><h2>企画研究 <span class="k">ネタ ${S.neta}/${NETA_MAX}</span></h2><p class="muted" style="margin:0">ネタは連載が進むとたまる(最大${NETA_MAX})。ジャンル20・テーマ12で研究し、企画会議で選べるようになる。</p>
   <div class="pillset">${lockG.map(g=>`<button data-act="unlock" data-id="G" data-v="${g}" ${S.neta<20?'disabled':''}>${g}</button>`).join('')||'<span class="k">全ジャンル研究済み</span>'}</div>
   <div class="pillset">${lockT.map(t=>`<button data-act="unlock" data-id="T" data-v="${t}" ${S.neta<12?'disabled':''}>${t}</button>`).join('')||'<span class="k">全テーマ研究済み</span>'}</div></section>
   <section class="card koma"><h2>目標</h2><div class="lst">${MS.map(m=>`<div><span class="${S.ms[m.id]?'good':'muted'}">${S.ms[m.id]?'済':'・'}</span> <span class="${S.ms[m.id]?'':'muted'}">${m.t}</span>${m.r?` <span class="k">+${man(m.r)}</span>`:''}</div>`).join('')}</div></section>
   <section class="card koma" style="grid-column:1/-1"><h2>企画ノート <span class="k">${Object.keys(S.known).length}組 判明</span></h2>
   <div class="scroll"><table class="note"><thead><tr><th></th>${S.T.map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${S.G.map(g=>`<tr><th>${g}</th>${S.T.map(t=>{const k=g+'|'+t;const gr=grade(g,t);return`<td class="${S.known[k]?(gr===3?'good':gr===0?'bad':''):'muted'}">${S.known[k]?CNAME[gr]:'・'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>
   <p class="muted" style="margin:0">傑作は出来が大きく伸びる組み合わせ。連載か読み切りで判明する。</p></section></div>`;
}

/* ================= 入力 ================= */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled||!S||b.closest('#modal'))return;const f=ACT[b.dataset.act];if(!f)return;
  if(b.dataset.id!==undefined)f(b.dataset.id,b.dataset.v);else f(b.dataset.v)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(!el||!S)return;const k=el.dataset.change;
  if(k==='pmode')ACT.pmode(el.dataset.id,el.value);else if(k==='policy')ACT.policy(el.value);else if(k==='confirm')ACT.confirm(el.checked?'1':'0')});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&S&&!modalOpen&&!['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();speed=speed?0:1;renderTop()}});

/* ================= ドット絵 ================= */
const cv=$('#cv'),cx=cv.getContext('2d');cx.setTransform(2,0,0,2,0,0);
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function fitCanvas(){const box=cv.parentElement;const w=box.clientWidth;if(!w)return;const k=Math.max(1,Math.floor(w/320));cv.style.width=Math.min(w,k*320)+'px'}
new ResizeObserver(fitCanvas).observe(cv.parentElement);fitCanvas();
function sprite(x,y,hair,shirt,t,i,mode){
  const ph=Math.floor(t/(mode==='tired'?380:170)+i)%2;
  cx.fillStyle='#1c1e29';cx.fillRect(x-1,y+8,12,10);cx.fillStyle=shirt;cx.fillRect(x,y+9,10,9);
  const hb=mode==='slump'?2:0;
  cx.fillStyle='#1c1e29';cx.fillRect(x,y-1+hb,10,10);cx.fillStyle='#f2c9a0';cx.fillRect(x+1,y+hb,8,8);cx.fillStyle=hair;cx.fillRect(x+1,y+hb,8,3);cx.fillRect(x+1,y+hb,2,5);
  if(mode==='draw'||mode==='tired'){cx.fillStyle='#f2c9a0';cx.fillRect(x+(ph?9:7),y+12,3,3);cx.fillStyle='#1c1e29';cx.fillRect(x+(ph?11:9),y+11,1,4)}
  if(mode==='talk'&&ph){cx.fillStyle='#fff';cx.fillRect(x-6,y-6,6,4);cx.fillStyle='#1c1e29';cx.fillRect(x-5,y-5,4,1)}
  if(mode==='tired'){cx.fillStyle='#7fc6ff';cx.fillRect(x+11,y+1,2,3)}
  if(mode==='slump'){cx.fillStyle='#3a6fd0';for(let k=0;k<3;k++)cx.fillRect(x+2+k*3,y+3,1,3)}
  if(mode==='sleep'){cx.font='8px "DotGothic16", monospace';cx.fillStyle=css('--muted');cx.textAlign='left';cx.fillText('z',x+11,y-1)}
}
let slotOf={};
function drawOffice(t){
  const W=320,H=176;cx.imageSmoothingEnabled=false;
  cx.fillStyle=css('--wall');cx.fillRect(0,0,W,36);
  const f1=css('--floor1'),f2=css('--floor2');for(let y=36;y<H;y+=8)for(let x=0;x<W;x+=16){cx.fillStyle=(((x>>4)+((y-36)>>3))&1)?f1:f2;cx.fillRect(x,y,16,8)}
  cx.fillStyle='#1c1e29';cx.fillRect(0,35,W,2);
  [[14,6],[262,6]].forEach(([x,y])=>{cx.fillStyle='#1c1e29';cx.fillRect(x-1,y-1,44,24);cx.fillStyle=S&&(S.week-1)%4===3?'#23305a':'#9fd6f2';cx.fillRect(x,y,42,22);cx.fillStyle='#1c1e29';cx.fillRect(x+20,y,2,22)});
  cx.fillStyle='#6b4a2a';cx.fillRect(100,4,64,30);const bc=['#e8573f','#3f7be8','#ffbf1f','#4fb06a','#ef7fb0'];
  for(let r=0;r<3;r++)for(let i=0;i<13;i++){cx.fillStyle=bc[(i*7+r*3)%5];cx.fillRect(102+i*5,6+r*9,4,8)}
  cx.fillStyle='#fff';cx.fillRect(184,8,26,20);cx.fillStyle='#cf3434';cx.fillRect(186,10,22,4);cx.fillStyle='#1c1e29';cx.fillRect(186,17,16,2);cx.fillRect(186,22,20,2);
  cx.fillStyle='#f5f6f0';cx.fillRect(220,8,32,22);cx.fillStyle='#1c1e29';cx.fillRect(222,11,14,2);cx.fillRect(222,16,24,1);cx.fillRect(222,20,20,1);cx.fillRect(222,24,22,1);
  // 仕切り線
  cx.fillStyle='#1c1e29';cx.fillRect(0,100,W,1);
  cx.font='8px "DotGothic16", monospace';cx.textAlign='left';cx.fillStyle=css('--ink');cx.fillText('編集部',4,46);cx.fillText('作家の仕事場',4,97);
  if(!S)return;
  const nd=desks();
  for(let i=0;i<nd;i++){const x=10+i*34,y=78;const e=S.editors[i];
    if(e){sprite(x+8,y-18,e.hair,e.shirt,t,i,eLoad(e)?(Math.floor(t/900+i)%3?'talk':'draw'):'sleep')}
    cx.fillStyle='#1c1e29';cx.fillRect(x-1,y-1,30,11);cx.fillStyle='#8a5a32';cx.fillRect(x,y,28,9);cx.fillStyle='#a8703f';cx.fillRect(x,y,28,3);cx.fillStyle='#fff';cx.fillRect(x+8,y-2,12,4)}
  const working=S.artists.filter(a=>a.sid||a.oneshot).slice(0,8);slotOf={};
  working.forEach((a,i)=>{const x=10+i*39,y=150;slotOf[a.id]=x+14;const s=a.sid?ser(a.sid):null;
    const mode=a.slump?'slump':(s&&(s.resting||s.hiatus))?'sleep':a.stam<a.stamMax*.25?'tired':'draw';
    sprite(x+9,y-18,a.hair,a.shirt,t,i,mode);
    cx.fillStyle='#1c1e29';cx.fillRect(x-1,y-1,32,11);cx.fillStyle='#8a5a32';cx.fillRect(x,y,30,9);cx.fillStyle='#a8703f';cx.fillRect(x,y,30,3);cx.fillStyle='#fff';cx.fillRect(x+9,y-2,12,4);
    if(s&&s.prog>=0){cx.fillStyle=css('--accent');cx.fillRect(x,y+11,Math.round(30*Math.min(1,s.prog/s.total)),2)}});
  const more=S.artists.filter(a=>a.sid||a.oneshot).length-working.length;if(more>0){cx.fillStyle=css('--muted');cx.fillText(`+${more}`,296,140)}
  cx.textAlign='center';
  floaters=floaters.filter(f=>f.t<22&&slotOf[f.aid]!==undefined);
  const cnt={};for(let j=floaters.length-1;j>=0;j--){const f=floaters[j];cnt[f.aid]=(cnt[f.aid]||0)+1;if(cnt[f.aid]>2)f.t=99}
  floaters=floaters.filter(f=>f.t<22);
  const stack={};cx.lineWidth=2;cx.strokeStyle='#1c1e29';cx.lineJoin='round';
  floaters.forEach(f=>{const x=slotOf[f.aid];const k=stack[f.aid]=(stack[f.aid]||0)+1;const y=126-f.t*.6-(k-1)*7;cx.strokeText(f.text,x,y);cx.fillStyle=f.col.startsWith('--')?css(f.col):f.col;cx.fillText(f.text,x,y);f.t++});
}

/* ================= ループ・保存 ================= */
const SUBMS=[0,560,280,120];
let lastDraw=0;
function loop(t){
  requestAnimationFrame(loop);
  try{
    if(t-lastDraw>70){drawOffice(t);lastDraw=t}
    if(S&&!S.over&&!modalOpen&&speed>0&&t-lastSub>SUBMS[speed]){lastSub=t;subtick()}
  }catch(e){console.error(e);if(S&&!S.errShown){S.errShown=true;speed=0;log('内部エラーが起きたので時間を止めた: '+e.message,'badl');renderTop();renderTicker()}}
}
function save(){try{localStorage.setItem('cpk-save',JSON.stringify(S))}catch(e){}}
function loadSave(){try{const t=localStorage.getItem('cpk-save');const sv=t?JSON.parse(t):null;return sv&&sv.ver===SAVE_VER?sv:null}catch(e){return null}}
function start(){
  const sv=loadSave();const st={co:'ひよこ書房',title:'',g:'バトル',t:'忍者',mk:'少年週刊',mag:''};modalOpen=true;
  const starts=[{mk:'少年週刊',d:'最大の市場。ライバルも強いが、当たれば大きい。'},{mk:'少年月刊',d:'じっくり型。作家に優しい。'},{mk:'青年週刊',d:'大人向け。シリアスやお色気が強い。'},{mk:'少女月刊',d:'ラブコメの王国。ライバルが比較的手薄。'}];
  const draw=()=>{
    if(!st.title)st.title=genTitle(st.g,st.t);if(!st.mag)st.mag=`${MKT[st.mk].freq}${MKT[st.mk].demo}${pick(MAGW)}`;
    openBox(`<h1 class="title-hero">コミック発展国<br><span>${START_YEAR}年、無名の出版社から</span></h1>
     <p>あなたは小さな漫画出版社の社長。手元にあるのは雑誌一誌と、そこそこ人気の看板作品だけ。新連載を企画し、作家と編集者を育て、雑誌を増やし、紙から電子への時代の波を越えて、業界ナンバーワンを目指そう。</p>
     ${sv?`<button id="cont">続きから(${esc(sv.co)} ${dateStr(sv.week)})</button>`:''}
     <div class="field"><label for="co">社名</label><input type="text" id="co" value="${esc(st.co)}" maxlength="14"></div>
     <div class="field"><span class="lb">最初の雑誌</span><div class="opts">${starts.map(s=>`<button class="opt ${st.mk===s.mk?'sel':''}" data-mk="${s.mk}"><b>${s.mk}誌</b><small>${s.d}</small></button>`).join('')}</div></div>
     <div class="field"><label for="mag">誌名</label><input type="text" id="mag" value="${esc(st.mag)}" maxlength="16"></div>
     <div class="field"><span class="lb">看板作品のジャンル×テーマ</span><div class="pillset">${G_START.map(g=>`<button data-g="${g}" class="${st.g===g?'sel':''}">${g}</button>`).join('')}</div><div class="pillset">${T_START.map(t=>`<button data-t="${t}" class="${st.t===t?'sel':''}">${t}</button>`).join('')}</div></div>
     <div class="field"><label for="ttl">看板作品のタイトル <span class="k">単行本5巻・累計50万部・人気はそこそこ</span></label><div class="row"><input type="text" id="ttl" value="${esc(st.title)}" maxlength="20" style="flex:1;min-width:0"><button class="sub" id="rr">別案</button></div></div>
     <p class="k" style="margin:0">時間は自動で進む(スペースキーで一時停止)。週刊誌は毎週、月刊誌は4週ごとに発売。2010年ごろから電子の時代が来る。</p>
     <div class="foot"><button id="go">${sv?'新しく始める':'社長に就任する'}</button></div>`,true);
    const keep=()=>{st.co=$('#co').value;st.title=$('#ttl').value;st.mag=$('#mag').value};
    on('[data-mk]',el=>{keep();st.mk=el.dataset.mk;st.mag='';draw()});
    on('[data-g]',el=>{keep();st.g=el.dataset.g;st.title='';draw()});
    on('[data-t]',el=>{keep();st.t=el.dataset.t;st.title='';draw()});
    on('#rr',()=>{keep();st.title=genTitle(st.g,st.t);draw()});
    on('#cont',()=>{S=sv;S.queue=S.queue||[];modalOpen=false;hideModal();renderAll();showNext()});
    on('#go',()=>{keep();newGame(st.co.trim()||'ひよこ書房',{title:st.title.trim()||genTitle(st.g,st.t),g:st.g,t:st.t},st.mk,st.mag.trim()||`${MKT[st.mk].freq}${MKT[st.mk].demo}${pick(MAGW)}`);modalOpen=false;hideModal();TAB='mag';speed=1;renderAll();save()});
  };draw();
}
try{const th=localStorage.getItem('cpk-theme');if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
window.claude?.hot?.snapshot?.(()=>({S,TAB,speed}));
function boot(data){
  if(data&&data.S&&data.S.pool&&data.S.ver===SAVE_VER){S=data.S;TAB=data.TAB||'mag';speed=data.speed??1;S.queue=S.queue||[];modalOpen=false;renderAll();showNext()}else start();
  requestAnimationFrame(loop);
}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
