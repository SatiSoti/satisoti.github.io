<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コミック発展国</title><style>
/* ui.css — コミック発展国 v2 (builder B6). Palette and koma panels ported from the previous version (L5).
   Light tokens on :root; dark under prefers-color-scheme guarded by :root:not([data-theme="light"]) and :root[data-theme="dark"].
   Local font stacks only (no network). PERF: common Linux Japanese families (IPA, VL, Takao, WenQuanYi) close each stack, so a
   Linux browser without the earlier fonts takes one listed CJK font instead of a system fallback per character (~50 ms of layout per
   screen switch in headless Chromium). Mac and Windows still match the earlier families first. */
:root{
  --paper:#f5f6f0; --panel:#ffffff; --panel2:#eef1f4; --ink:#1c1e29; --muted:#5b6072; --guide:#d3e6f2;
  --accent:#ffbf1f; --accent-ink:#1c1e29; --good:#1d7a42; --bad:#cf3434; --warn:#9c5c00; --on-fill:#fff;
  --p-st:#3a6fd0; --p-art:#d9473b; --p-ch:#c99200; --p-dir:#23894c;
  --shonen:#e8801a; --otona:#1f8378; --shojo:#c8418a; --all:#6a55c9;
  --seg0:#e8801a; --seg1:#c8418a; --seg2:#1f8378; --seg3:#a0522d; --seg4:#6a55c9; --seg5:#2f8fbf;
  --own-bg:#e6f3ea; --est-bg:#f1f0fb; --wall:#cfe3ea; --floor1:#d9b98c; --floor2:#cfae7f; --shadow:#1c1e29;
  --font-pixel:"DotGothic16","Osaka-Mono","MS Gothic","Noto Sans Mono CJK JP","IPAGothic","VL Gothic","TakaoGothic","WenQuanYi Zen Hei Mono",monospace;
  --font-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo","Noto Sans CJK JP","IPAPGothic","VL PGothic","TakaoPGothic","WenQuanYi Zen Hei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#161925; --panel:#20253a; --panel2:#2a304a; --ink:#e6e8f2; --muted:#a2a7bd; --guide:#2a3350;
  --accent:#ffc63d; --accent-ink:#1c1e29; --good:#5ccf86; --bad:#ff6d6d; --warn:#f0a73a; --on-fill:#1c1e29;
  --p-st:#6f9bff; --p-art:#ff7a6b; --p-ch:#ffcf4a; --p-dir:#5ccf86;
  --shonen:#ff9a3d; --otona:#3cc0b0; --shojo:#f070b0; --all:#9b88ff;
  --seg0:#ff9a3d; --seg1:#f070b0; --seg2:#3cc0b0; --seg3:#e09060; --seg4:#9b88ff; --seg5:#5cb8e6;
  --own-bg:#1f3a2c; --est-bg:#2b2a48; --wall:#2c3f55; --floor1:#5a4630; --floor2:#52402b; --shadow:#05060a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#161925; --panel:#20253a; --panel2:#2a304a; --ink:#e6e8f2; --muted:#a2a7bd; --guide:#2a3350;
  --accent:#ffc63d; --accent-ink:#1c1e29; --good:#5ccf86; --bad:#ff6d6d; --warn:#f0a73a; --on-fill:#1c1e29;
  --p-st:#6f9bff; --p-art:#ff7a6b; --p-ch:#ffcf4a; --p-dir:#5ccf86;
  --shonen:#ff9a3d; --otona:#3cc0b0; --shojo:#f070b0; --all:#9b88ff;
  --seg0:#ff9a3d; --seg1:#f070b0; --seg2:#3cc0b0; --seg3:#e09060; --seg4:#9b88ff; --seg5:#5cb8e6;
  --own-bg:#1f3a2c; --est-bg:#2b2a48; --wall:#2c3f55; --floor1:#5a4630; --floor2:#52402b; --shadow:#05060a; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background-color:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.55;
  background-image:linear-gradient(var(--guide) 1px,transparent 1px),linear-gradient(90deg,var(--guide) 1px,transparent 1px);background-size:22px 22px;
  overflow-x:hidden}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--font-pixel);font-weight:400;margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
small{font-size:12px}

/* ---------- shell ---------- */
#app{max-width:1280px;margin:0 auto;padding:12px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
#app>*{min-width:0}
#view{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:900px){
  #app{grid-template-columns:172px minmax(0,1fr);grid-template-areas:"top top" "nav view"}
  #top{grid-area:top} #nav{grid-area:nav;position:sticky;top:12px} #view{grid-area:view}
  .nav-phone{display:none!important}
}
@media (max-width:899px){
  #app{padding-bottom:92px}
  .nav-desk{display:none!important}
  #nav{position:fixed;left:0;right:0;bottom:0;z-index:20}
}
#app.no-game #nav,#app.no-game #top{display:none}
#app.no-game{grid-template-columns:minmax(0,1fr);grid-template-areas:"view"}

.koma{background:var(--panel);border:2.5px solid var(--ink);box-shadow:4px 4px 0 var(--shadow)}
.card{padding:12px;display:flex;flex-direction:column;gap:9px;min-width:0}
.card>h2{font-size:18px}
.card>h3,.sub-h{font-size:15px}
.koma>h3.bar-h{font-size:14px;margin:0;padding:6px 10px;background:var(--ink);color:var(--paper);letter-spacing:.06em}

/* ---------- controls ---------- */
button,select,.btn{font-family:var(--font-pixel);font-size:13px;color:var(--accent-ink);background:var(--accent);border:2px solid var(--ink);
  box-shadow:2px 2px 0 var(--shadow);padding:5px 10px;cursor:pointer;line-height:1.3;min-height:36px;text-decoration:none;display:inline-flex;align-items:center;
  justify-content:center;gap:4px;white-space:normal;text-align:center;max-width:100%}
button:hover,.btn:hover{filter:brightness(1.06)}
button:active,.btn:active{transform:translate(2px,2px);box-shadow:none}
button:disabled{background:var(--panel2);color:var(--muted);cursor:not-allowed;box-shadow:none;border-color:var(--muted)}
button.sub,.btn.sub{background:var(--panel);color:var(--ink)}
button.danger{background:var(--panel);color:var(--bad);border-color:var(--bad);box-shadow:2px 2px 0 var(--bad)}
button.sub:disabled,button.danger:disabled{background:var(--panel2);color:var(--muted);border-color:var(--muted);box-shadow:none}  /* QA: a disabled 返済/解雇 looked enabled */
button.small,.btn.small{font-size:12px;padding:2px 8px;min-height:32px}
select{background:var(--panel);color:var(--ink);box-shadow:none;max-width:100%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;justify-content:flex-start;text-align:left}
input[type=text],input[type=number],input[type=search],textarea{font-family:var(--font-pixel);font-size:15px;padding:6px 8px;border:2px solid var(--ink);
  background:var(--panel);color:var(--ink);width:100%;min-width:0;min-height:38px}
input[type=number]{max-width:9em}
input[type=range]{width:100%;accent-color:var(--shojo)}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--shojo);vertical-align:-3px}
textarea{min-height:120px;font-size:12px;font-family:monospace;word-break:break-all}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--shojo);outline-offset:2px}
a.link,button.link{background:none;border:none;box-shadow:none;padding:0;min-height:0;font-family:var(--font-body);font-weight:700;color:var(--ink);text-align:left;
  text-decoration:underline dotted var(--muted);text-underline-offset:3px;cursor:pointer;display:inline}
label.ck{display:inline-flex;align-items:center;gap:6px;min-height:36px;cursor:pointer}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.field>.lb{font-family:var(--font-pixel);font-size:13px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:8px 12px;align-items:end}
.form .field.wide{grid-column:1/-1}
.ckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:2px 8px;max-height:220px;overflow-y:auto;border:2px solid var(--guide);padding:4px 8px}
details>summary{cursor:pointer;font-family:var(--font-pixel);font-size:13px;min-height:36px;display:flex;align-items:center;gap:6px;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:'▶';font-size:10px;transition:transform .1s}
details[open]>summary::before{transform:rotate(90deg)}
details.box{border:2px dashed var(--guide);padding:4px 8px}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:8px 12px}
.top .co{font-family:var(--font-pixel);font-size:19px;max-width:100%;overflow-wrap:anywhere}
.top .stat{display:flex;flex-direction:column;line-height:1.15}
.top .stat small{font-size:11px;color:var(--muted);letter-spacing:.06em}
.top .stat b{font-family:var(--font-pixel);font-size:16px;font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
.top .speed{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.top .speed button{min-width:40px;min-height:40px}
.top .speed button.on{background:var(--ink);color:var(--paper)}
.badge{font-family:var(--font-pixel);font-size:12px;border:2px solid currentColor;padding:1px 7px;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;min-height:28px}
.badge.alert{background:var(--bad);color:#fff;border-color:var(--bad)}
.badge.warnb{background:var(--warn);color:#fff;border-color:var(--warn)}
.badge.calm{color:var(--muted)}
@media (max-width:899px){
  .top{gap:4px 10px;padding:6px 8px}
  .top .co{font-size:16px;flex:1 1 100%}
  .top .stat b{font-size:14px}
  .top .speed{margin-left:0;width:100%;justify-content:space-between}
  .top .speed button{flex:1 1 0;min-width:0;padding:4px 2px;white-space:nowrap;font-size:13px}
  .top .speed button[data-ui="step"]{flex:2.2 1 0}
}

/* ---------- nav ---------- */
.nav-desk{display:flex;flex-direction:column;gap:5px}
.nav-desk a{font-family:var(--font-pixel);font-size:14px;background:var(--panel);color:var(--ink);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--shadow);
  padding:6px 10px;text-decoration:none;min-height:38px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.nav-desk a.on{background:var(--ink);color:var(--paper)}
.nav-desk .sep{height:4px}
.nav-phone{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--panel);border-top:2.5px solid var(--ink);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.nav-phone a,.nav-phone button{font-family:var(--font-pixel);font-size:12px;color:var(--ink);background:none;border:none;box-shadow:none;min-height:48px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;text-decoration:none;gap:1px;padding:2px}
.nav-phone .ic{font-size:17px;line-height:1;position:relative}
.nav-phone .ic .nb{position:absolute;top:-7px;left:calc(100% - 4px);font-size:10px;padding:0 4px}
.nav-phone .lb{font-size:11px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.nav-phone .on{background:var(--ink);color:var(--paper)}
.nb{font-family:var(--font-pixel);font-size:11px;background:var(--bad);color:#fff;padding:0 5px;border-radius:8px;line-height:1.5}
.sheet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sheet a{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:4px;white-space:normal;text-align:left;overflow-wrap:anywhere}
@media (max-width:420px){.sheet{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- common blocks ---------- */
.row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;min-width:0}
.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px}
@media (min-width:1000px){#view .grid2>.span2{grid-column:span 2}}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:900px){.stage{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.office{padding:0;overflow:hidden;background:var(--panel2);display:flex;justify-content:center;align-items:center;align-self:start}
.office canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
.k{font-size:11px;color:var(--muted);letter-spacing:.04em}
.num{font-family:var(--font-pixel);font-variant-numeric:tabular-nums}
.big{font-family:var(--font-pixel);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,118px),1fr));gap:6px 12px}
.kv>div{display:flex;flex-direction:column;min-width:0}
.kv b{font-family:var(--font-pixel);font-weight:400;font-size:15px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv b small{display:block;font-size:11px}
.chip{font-family:var(--font-pixel);font-size:12px;padding:1px 7px;border:2px solid currentColor;line-height:1.4;white-space:nowrap;display:inline-block}
.tag{font-size:11px;font-family:var(--font-pixel);background:var(--ink);color:var(--paper);padding:1px 6px;white-space:nowrap;display:inline-block;line-height:1.5}
.tag.hot{background:var(--shojo);color:#fff} .tag.warn{background:var(--warn);color:#fff} .tag.gold{background:var(--accent);color:var(--accent-ink)}
.tag.blue{background:var(--p-st);color:#fff} .tag.good{background:var(--good);color:var(--on-fill)} .tag.bad{background:var(--bad);color:#fff}
.tag.line{background:none;color:var(--ink);border:1px solid var(--ink)}
.tag.own{background:var(--good);color:var(--on-fill)}
.burst{font-family:var(--font-pixel);display:inline-block;background:var(--accent);color:var(--accent-ink);border:2px solid var(--ink);padding:2px 10px;font-size:13px;align-self:flex-start;transform:rotate(-2deg)}
.hint{border:2px dashed var(--p-st);background:var(--panel);padding:8px 10px;display:flex;gap:8px;align-items:flex-start}
.hint::before{content:'ヒント';font-family:var(--font-pixel);font-size:11px;background:var(--p-st);color:#fff;padding:0 5px;white-space:nowrap}
.prep{border-style:dashed}
.prep b{font-family:var(--font-pixel)}
.empty{border:2px dashed var(--muted);padding:10px;color:var(--muted);text-align:center}
.lst{display:flex;flex-direction:column;gap:2px;font-size:13px}
.lst>div,.lst>a{border-bottom:1px dashed var(--guide);padding:4px 0;display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;text-decoration:none}
.lst>a:hover{background:var(--panel2)}
.lst .d{font-family:var(--font-pixel);color:var(--muted);font-size:11px;white-space:nowrap}
.ticker{padding:6px 10px;display:flex;flex-direction:column;gap:1px;max-height:260px;overflow-y:auto;font-size:13px}
.ticker>div{border-bottom:1px dashed var(--guide);padding:3px 0}
.ticker .d{font-family:var(--font-pixel);color:var(--muted);font-size:11px;margin-right:6px}
.p-urgent{color:var(--bad)} .p-log{color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs a{font-family:var(--font-pixel);font-size:13px;background:var(--panel);color:var(--ink);border:2px solid var(--ink);padding:4px 12px;text-decoration:none;min-height:36px;display:inline-flex;align-items:center;gap:5px}
.tabs a.on{background:var(--ink);color:var(--paper)}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.head h2{font-size:20px}
.crumb{font-size:12px;color:var(--muted)}
.crumb a{color:var(--muted)}

/* bars */
.bar{height:10px;border:2px solid var(--ink);background:var(--panel2);position:relative;min-width:40px;flex:1}
.bar>span{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.bar.good>span{background:var(--good)} .bar.bad>span{background:var(--bad)} .bar.pink>span{background:var(--shojo)} .bar.blue>span{background:var(--p-st)}
.col>.bar{flex:none;width:100%;height:10px}
.bars{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:3px 8px;align-items:center;font-size:12px}
.segs{display:grid;grid-template-columns:3.2em minmax(0,1fr) 3.4em;gap:2px 8px;align-items:center;font-size:12px}
.segs .sb{height:10px;border:1px solid var(--ink);background:var(--panel2);position:relative}
.segs .sb>i{position:absolute;inset:0 auto 0 0}
.seg0{background:var(--seg0)} .seg1{background:var(--seg1)} .seg2{background:var(--seg2)} .seg3{background:var(--seg3)} .seg4{background:var(--seg4)} .seg5{background:var(--seg5)}
.share{display:flex;height:14px;border:2px solid var(--ink);overflow:hidden}
.share>i{height:100%}
.stars{font-family:var(--font-pixel);color:var(--p-ch);letter-spacing:1px;white-space:nowrap}
.stars .off{color:var(--muted);opacity:.5}
.pm{display:flex;gap:4px;font-family:var(--font-pixel);font-size:12px;flex-wrap:wrap}
.pm span{border:1px solid var(--guide);padding:0 4px;min-width:38px;text-align:center;font-variant-numeric:tabular-nums}

/* tables */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
table.t{border-collapse:collapse;font-size:12px;width:100%}
table.t th,table.t td{border-bottom:1px solid var(--guide);padding:4px 6px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;vertical-align:top}
table.t td button{white-space:nowrap}
table.t th{font-weight:400;color:var(--muted);font-family:var(--font-pixel)}
table.t td:first-child,table.t th:first-child{text-align:left}
table.t td.l,table.t th.l{text-align:left;white-space:normal;min-width:7em}
table.t tr.own td{background:var(--own-bg)}
table.t tr.sum td{font-weight:700;border-top:2px solid var(--ink)}
table.t.mkt .co span{white-space:nowrap}
@media (max-width:899px){
  table.t.mkt td:first-child,table.t.mkt th:first-child{position:sticky;left:0;z-index:1;background:var(--panel);min-width:8.5em;max-width:11em;white-space:normal;box-shadow:2px 0 0 var(--guide)}
  table.t.mkt tr.own td:first-child{background:var(--own-bg)}
}
.est{background:var(--est-bg);padding:0 4px;white-space:normal}
.est small{color:var(--muted)}

/* cards for entities */
.ent{border-top:2px dashed var(--guide);padding:9px 0;display:grid;grid-template-columns:38px minmax(0,1fr);gap:4px 10px}
.ent:first-child{border-top:none}
.ent .bd{min-width:0;display:flex;flex-direction:column;gap:3px}
.ent .acts{grid-column:2;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.rank{font-family:var(--font-pixel);font-size:17px;width:36px;height:36px;display:grid;place-items:center;border:2px solid var(--ink);background:var(--panel2)}
.rank.r1{background:var(--accent);color:var(--accent-ink)}
.rank.low{background:var(--panel);color:var(--bad);border-color:var(--bad)}
.state-ready{color:var(--good)} .state-wip{color:var(--warn)} .state-short{color:var(--bad);font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:8px}
.opt{border:2px solid var(--ink);padding:8px;background:var(--panel);color:var(--ink);text-align:left;box-shadow:none;font-family:var(--font-body);display:flex;
  flex-direction:column;gap:3px;align-items:stretch;justify-content:flex-start;min-height:44px}
.opt.sel{background:var(--accent);color:var(--accent-ink);box-shadow:3px 3px 0 var(--shadow)}
.opt.locked{opacity:.55;border-style:dashed}
.opt b{font-family:var(--font-pixel);font-weight:400;font-size:14px}
.opt small{font-size:11px;opacity:.9}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:6px}
.choice{border:2px solid var(--ink);padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.choice.rec{border-color:var(--good)}
.choice h4{font-size:15px}
.effects{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:6px 12px;font-size:12px}
.effects>div{border-left:3px solid var(--guide);padding-left:6px}

/* breakdown funnel */
.funnel{display:flex;flex-direction:column;gap:2px;font-size:12px}
.funnel>div{display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr) 6.5em;gap:6px;align-items:center}
@media (max-width:520px){.funnel>div{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 5.5em}}
.funnel .fb.ok>i{background:var(--good)}
.funnel .fb{height:9px;background:var(--panel2);border:1px solid var(--ink);position:relative}
.funnel .fb>i{position:absolute;inset:0 auto 0 0;background:var(--p-st)}
.funnel .neg>i{background:var(--bad)}
.funnel .num{text-align:right}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.cal .wk{border:2px solid var(--ink);background:var(--panel);padding:6px;display:flex;flex-direction:column;gap:4px;min-height:84px}
.cal .wk.now{border-color:var(--accent);box-shadow:3px 3px 0 var(--accent)}
.cal .wk h4{font-size:12px;color:var(--muted)}
.cal .it{font-size:12px;border-left:4px solid var(--muted);padding-left:5px}
.cal .it.own{border-left-color:var(--good)}
.cal .it.riv{border-left-color:var(--p-art)}

/* charts */
svg.chart{width:100%;height:auto;max-height:180px;display:block}
svg.chart .ax{stroke:var(--guide);stroke-width:1}
svg.chart .ln{fill:none;stroke:var(--p-st);stroke-width:2.5}
svg.chart .ln2{fill:none;stroke:var(--p-art);stroke-width:2;stroke-dasharray:4 3}
svg.chart .dt{fill:var(--p-st)}
svg.chart .dt2{fill:var(--p-art)}
svg.chart text{fill:var(--muted);font-size:10px;font-family:var(--font-pixel)}
svg.chart .zero{stroke:var(--bad);stroke-width:1;stroke-dasharray:3 3}

/* modal & toast */
#modal{position:fixed;inset:0;background:rgba(10,12,20,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
#modal[hidden]{display:none}
#modal .box{max-width:620px;width:100%;max-height:calc(100% - 16px);overflow-y:auto;overscroll-behavior:contain;padding:16px;display:flex;flex-direction:column;gap:12px}
#modal .box.wide{max-width:860px}
#modal h2{font-size:21px}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
#toast{position:fixed;right:16px;bottom:16px;z-index:50;display:flex;flex-direction:column;gap:6px;align-items:stretch;
  width:min(calc(100vw - 32px),380px);pointer-events:none}
@media (max-width:899px){#toast{right:16px;left:16px;width:auto;bottom:84px}}
#toast .ts{pointer-events:auto;background:var(--ink);color:var(--paper);border:2px solid var(--ink);padding:6px 10px;font-size:13px;line-height:1.45;box-shadow:3px 3px 0 var(--accent)}
#toast .ts a{color:inherit}
#toast .ts.err{background:var(--bad);color:#fff;box-shadow:3px 3px 0 var(--shadow)}
#toast .ts.ok{background:var(--good);color:var(--on-fill)}

/* title */
.title-hero{font-family:var(--font-pixel);font-size:34px;line-height:1.15;margin:0}
.title-hero span{display:inline-block;background:var(--ink);color:var(--accent);padding:2px 8px;margin-top:6px;font-size:15px}
.title{max-width:640px;margin:24px auto;padding:18px}

/* dev */
.st-done{color:var(--good)} .st-partial{color:var(--warn)} .st-stub{color:var(--bad)}
pre.code{white-space:pre-wrap;word-break:break-all;font-size:11px;background:var(--panel2);padding:6px;max-height:260px;overflow:auto;margin:0}

@media (pointer:coarse){button,select,.btn{min-height:40px}.tabs a{min-height:40px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- screen-switch cost (PERF-03) ---------- */
/* cards below the fold skip style/layout/paint until scrolled near; 'auto' remembers the last real size */
#view>.koma,#view .grid2>*,#view article.koma{content-visibility:auto;contain-intrinsic-size:auto 320px}

#view article.koma[id^="pc-"]{contain-intrinsic-size:auto 780px}

家としての判断の変化を両方描く。","T02_S55":"通常のペットの日常から大規模な戦闘を導くには、擬人化や世界の規則の追加が必要。動物の動き自体は見せ場にできる。","T03_S32":"明確な勝敗と昇段が連載の節目になる。盤面の専門性を、人物の判断と分かりやすい局面に翻訳する。","T04_S41":"身分、縁談、立場の違いが関係の障害になる。宮廷の制度だけで人物の気持ちを代替しない。","T07_S45":"戦闘の危険と安心して読める日常の両立に工夫が必要。後方の日々や短い休息に焦点を置けば成立する。","T07_S53":"終末の切迫感を抑えながら心地よさを作る必要がある。安全な拠点、生活の工夫、季節の変化を軸にできる。","T08_S52":"時間移動の制約と知識差が謎になる。解決後にだけ便利な時間規則を追加せず、先に読者へ提示する。","T10_S55":"動物への安心感と恐怖の主眼が衝突しやすい。動物を危険の予兆に使うなど、恐怖の対象を明確に設計する。","T12_S55":"通常の飼育の日常では継続的な生存危機を作りにくい。迷子や災害下の動物に焦点を絞れば成立する。","T13_S53":"通常の顧客・報酬・評価の仕組みが失われている。新しい仕事の依頼や物々交換の制度を作れば成功の段階を示せる。","T16_S34":"自然を楽しむ活動自体には報復相手がいない。過去の事故や隠蔽など、人間同士の対立を追加する必要がある。","T17_S55":"動物が何を推測できるかを読者と共有しにくい。擬人化の範囲や観察できる行動を先に定めると駆け引きが成立する。","T18_S34":"自然相手の活動だけでは勢力と権力が生まれにくい。登山団体、地域開発、遠征の権限争いへ焦点を置く必要がある。","T18_S55":"通常の飼育には明確な権力構造が少ない。群れの序列や動物を巡る人の組織を設定すると政争を組み立てられる。","T19_S55":"飼育の日常には富や地位を上げる階段が少ない。ショーへの挑戦や動物の社会など、何を成功とするかの追加定義が要る。","T20_S55":"人と動物という違いを協力の理由にできる。言葉以外で信頼が変化したことを示す必要がある。","T22_S59":"拡散、数字による評価、発信者と受け手のずれを風刺に使える。特定個人への攻撃に依存せず仕組みを描く。","T24_S55":"ともに暮らした日常が別れの重さになる。動物の不幸だけを繰り返すのでなく、関係の積み重ねを描く。"},"settings":{"clock.start_year":1996,"clock.weeks_per_year":52,"clock.digital_unlock_tick":728,"start.cash":30000000,"start.magazine_last_sales":12000,"start.magazine_print":14000,"start.magazine_series":6,"start.editors":3,"start.editor_salary":60000,"start.overhead":100000,"mag.price":500,"mag.publisher_share":0.6,"mag.print_cost":180,"mag.page_fee":6000,"mag.market_cap":300000,"mag.initial_manga_pages":192,"mag.new_manga_pages":320,"mag.editorial_pages":24,"mag.new_series_count":10,"mag.launch_weeks":13,"mag.launch_cost":5000000,"editor.capacity":100,"editor.capacity_cap":120,"editor.episode_cost":40,"editor.pitch_cost":15,"editor.volume_cost":10,"mag.cover_exposure":1.15,"mag.opening_response":1.08,"mag.color_response":1.05,"mag.placement_cap":1.2,"quality.story_weight":0.35,"quality.art_weight":0.25,"quality.character_weight":0.25,"quality.readability_weight":0.15,"audience.type_weight":0.4,"audience.subject_   if (!aId || !W.authors[aId]) return 0;
  let L = 0;
  for (const id of C.ids(W, 'media')) {                           // whatever the series' status (finished works too)
    const md = W.media[id]; if (!LIVE.has(md.phase)) continue;
    const sr = W.series[md.seriesId]; if (!sr || sr.authorId !== aId) continue;
    L += (sr.lastNominal || 0) * S(W, 'media.' + md.format + '.author_load') * supFraction(md);
  }
  return nz(L);
};

// ------------------------------------------------------------------------------------------------ periodic: reach, sequel review (5.5.7), quarterly offers
function accumulateReach(W, t) {                                            // actual reach during the peak (S_end; 9.6)
  const haveMkt = C.has('mkt', 'contacts');
  for (const id of C.ids(W, 'media')) {
    const md = W.media[id]; if (md.phase !== 'airing') continue;
    const sr = W.series[md.seriesId]; if (!sr) continue;
    let add = 0;
    const spendAll = {}, spendTag = {};
    for (const pcId of C.ids(W, 'promos')) {
      const p = W.promos[pcId];
      if (p.pubId !== md.pubId || !(p.fromTick <= t && t < p.untilTick)) continue;
      const tgt = p.target || {};
      const ofSeries = (tgt.kind === 'series' && tgt.id === sr.id) || (tgt.kind === 'volume' && W.vols[tgt.id] && W.vols[tgt.id].seriesId === sr.id);
      if (!ofSeries) continue;
      spendAll[p.channel] = (spendAll[p.channel] || 0) + p.weekly;
      if (p.mediaTag === md.id) spendTag[p.channel] = (spendTag[p.channel] || 0) + p.weekly;
    }
    if (haveMkt) {
      const ct = W.week && W.week.contacts ? W.week.contacts[sr.id] : null;
      if (ct) {
        for (const s of ct.mediaBase || []) add += s;
        for (const ch of Object.keys(spendTag).sort()) {
          const k = ct.promo && ct.promo[ch]; if (!k) continue;
          let tot = 0; for (const x of k) tot += x;
          add += tot * spendTag[ch] / spendAll[ch];
        }
      }
    } else {
      add += S(W, 'media.base_reach') * MD.envOf(W, md, t);
      for (const ch of Object.keys(spendTag).sort()) add += S(W, 'promo.' + ch + '.reach') * Math.sqrt(spendAll[ch] / 100000) * spendTag[ch] / spendAll[ch];
    }
    md.reachActual = Math.round(md.reachActual + add);
  }
}
function sequelReviews(W, t) {
  const capN = S(W, 'media.offers_per_quarter_cap');
  for (const id of C.ids(W, 'media')) {
    const md = W.media[id];
    if (md.phase !== 'ended' || md.sequelReviewed || md.peakEnd === null || t < md.peakEnd + SEQUEL_WAIT) continue;
    md.sequelReviewed = true;
    const sr = W.series[md.seriesId]; if (!sr) continue;
    if (md.S_end === null || md.S_end < SEQUEL_S_MIN) continue;             // 成果点
    const st = seriesStats(W, sr);
    if (st.published < md.cover.to + SEQUEL_NEW_VOLS) continue;             // 原作残りストック
    if (inProgress(W, sr, md.format)) continue;
    if (activeCounts(W, md.pubId)[md.format] >= MD.capOf(W, md.pubId, md.format)) continue;   // 制作側の枠
    if (offersThisQuarter(W, md.pubId, t) >= capN) continue;               // 四半期の提案上限は続編にも適用
    const u = C.rng(W, t, md.id, 'mediaGen', 8), p = pMediaFor(W, md);    // 作者合意 (new draw)
    if (!(u < p)) continue;
    createOffer(W, sr, md.format, {stats: st, sequelOf: md.id, consent: {u, p}});   // an offer, never automatic production
  }
}
MD.periodic = (W) => {
  const t = W.tick;
  accumulateReach(W, t);
  sequelReviews(W, t);
  if (t % 13 === 12) quarterlyOffers(W, t);
};

// ------------------------------------------------------------------------------------------------ compaction (§2.11 style; declined offers)
MD.compact = (W) => {
  const t = W.tick;
  for (const id of C.ids(W, 'media')) {
    const md = W.media[id];
    if (md.phase !== 'declined' || md.closedTick === null || t - md.closedTick < 13) continue;
    const sr = W.series[md.seriesId];
    if (sr) sr.mediaIds = sr.mediaIds.filter((x) => x !== id);

// ------------------------------------------------------------------------------------------------ outflow provider (D-96): supervision weeks and the contracted promo plan
C.registerOutflows('media', (W, pid, from, weeks) => {
  const out = [], to = from + weeks;
  for (const id of C.ids(W, 'media')) {
    const md = W.media[id];
    if (md.pubId !== pid || !(md.phase === 'contracted' || LIVE.has(md.phase))) continue;
    const ref = {type: 'media', id};
    const end = md.phase === 'airing' ? md.peakEnd : md.plannedRelease + MD.peakWeeks(W, md);      // exclusive
    if (md.supervisorId) {
      const start = md.phase === 'contracted' ? md.contractTick + 1 : from;
      for (let w = Math.max(from, start); w < Math.min(to, end); w++) out.push({tick: w, cat: 'supervision', amount: X(W, 'x.media.sup_cost_week'), ref});
    }
    if (md.phase !== 'airing' && md.promoPlan > 0) {
      for (let w = Math.max(from, md.plannedRelease); w < Math.min(to, end); w++) out.push({tick: w, cat: 'promo', amount: md.promoPlan, ref});
    }
  }

});

function setPlan(W, md, weekly, channel) {

  if (budget === undefined) return err('invalid', '宣伝手段が不正です');
  if (!Number.isInteger(weekly) || weekly < 0 || weekly % step) return err('invalid', '映像宣伝の週予算は' + C.fmtYen(step) + '単位で指定してください');
  if (weekly > budget) return err('budget', '1作品1週の予算上限（' + C.fmtYen(budget) + '）を超えます', {cap: budget});
  if ((ch === 'web' || ch === 'social') && md.plannedRelease < S(W, 'clock.digital_unlock_tick')) return err('unlock', 'Web広告・SNS施策は2010年から使えます');

  }

  if (md.phase !== 'offer') return err('closed', 'この打診にはすでに回答しています');
  if (t > md.offerDeadline) return err('closed', '契約期限を過ぎています');
  if (o.promoPlan !== undefined) { const r = setPlan(W, md, o.promoPlan, o.promoChannel); if (!r.ok) return r; }
  const supArg = o.supervisorId !== undefined ? o.supervisorId : o.editorId;
  if (supArg !== undefined && supArg !== null && supArg !== '') { const e = W.editors[supArg]; if (!e || e.pubId !== md.pubId) return err('notfound', '監修担当の編集者が見つかりません'); }
  if ((supArg === undefined || supArg === null || supArg === '') && needsSupervisor(md) && !pickSupervisor(W, md.pubId)) return noSupErr();

  if (ac.agreed) { contract(W, md); return {ok: true, agreed: true, phase: md.phase, S_expected: md.S_expected, sRange: sRange(md)}; }
  md.offerDeadline = Math.max(md.offerDeadline, t + X(W, 'x.media.offer_deadline'));

      {presidentOnly: true, deadline: md.offerDeadline, actions: [{label: '条件を改めて再提案', act: 'navigate', args: {route: '#media'}},

A.mediaReask = function (W, args) {

  const md = g.md, ac = md.authorConsent;
  if (md.phase !== 'negotiating' || ac.agreed) return err('closed', '再提案できる状態ではありません');
  if (ac.asked >= 2) return err('limit', '再提案は1度だけです');
  if (W.tick > md.offerDeadline) return err('closed', '期限を過ぎています');
  const st0 = md.askState || {sup: false, cap: ac.conditions.supervisionCap};
  const supRaw = o.supervisorId !== undefined ? o.supervisorId : o.editorId;
  const supArg = supRaw === '' ? null : supRaw;                             // the #media form sends '' for 監修担当なし
  const capArg = o.supervisionCap !== undefined && o.supervisionCap !== null ? o.supervisionCap : ac.conditions.supervisionCap;
  if (capArg !== ac.conditions.supervisionCap && capArg !== 0.5) return err('invalid', '監修範囲の上限は0.5（監修担当者あり）だけ選べます');
  if (supArg !== undefined && supArg !== null) {

  ac.agreed = ac.u < ac.p;

};

    if (r && r.ok) { n++; mem.promoBank = nz(Math.max(0, mem.promoBank - s.amt * s.weeks)); }
  }
  return n;
}

// ------------------------------------------------------------------------------------------------ 8.3.4 digital

// ------------------------------------------------------------------------------------------------ 8.3.6 media offers
function supervisorFor(W, pub) {

    const n = C.has('auth', 'activeAssignments') ? CH.auth.activeAssignments(W, id) : e.seriesIds.length;
    const cap = C.has('auth', 'editorCapacity') ? CH.auth.editorCapacity(W, e) : S(W, 'editor.capacity');
    const load = 100 * Math.max(e.load || 0, cost * n) / (cap > 0 ? cap : 100);

    const base = (id) => { const md = W.media[id], b = md ? CH.media.genreBase(W, md.seriesId) : null; return b ? (md.format === 'anime' ? b.anime : b.drama) + (md.format === 'anime' ? 0 : 1000) : 0; };

  for (const id of ids) {
    const md = W.media[id]; if (!md || md.phase !== 'offer') continue;
    if (maxActive > 0 && active >= maxActive) { act(W, 'mediaRespond', {pid, mdId: id, choice: 'decline'}); continue; }
    const sup = supervisorFor(W, pub);
    const r = act(W, 'mediaRespond', {pid, mdId: id, choice: 'accept', supervisorId: sup ? sup.id : undefined});
    if (r && r.ok && r.agreed !== false) active++;
    if (!r || !r.ok || r.agreed !== false) continue;
    // refused: one improved re-ask (a supervisor now, or the supervision cap lowered with a supervisor), else decline
    const cur = W.media[id]; let rr = null;

        rr = act(W, 'mediaReask', {pid, mdId: id, supervisionCap: 0.5});
      if (!rr || !rr.ok) { const c2 = W.media[id]; if (c2 && c2.phase === 'negotiating') act(W, 'mediaRespond', {pid, mdId: id, choice: 'decline'}); }
    }
  }

  if (!A.mediaAssignSupervisor) return;
  for (const id of C.ids(W, 'media')) {
    const md = W.media[id];
    if (md.pubId !== pid || md.supervisorId !== null || !md.authorConsent || !md.authorConsent.agreed) continue;
    if (!(md.authorConsent.conditions && md.authorConsent.conditions.supervisionCap < 1)) continue;
    if (md.phase === 'declined' || md.phase === 'cancelled' || md.phase === 'ended' || md.phase === 'offer') continue;
    const sup = supervisorFor(W, pub);

  }
}

// ------------------------------------------------------------------------------------------------ 8.3.7 next-work windows of own authors
function nextWorkOffers(W, pub, pr, list) {

    const a = W.authors[sr.authorId]; if (!a || done[a.id]) continue; done[a.id] = true;
    const nw = a.nextWork;

    if (nw.ownOffer.feeFactor !== pr.offerFee) act(W, 'setOwnOffer', {pid, aId: a.id, offer: {feeFactor: pr.offerFee}});

}

// ------------------------------------------------------------------------------------------------ 8.4.1 cases (completion consults)
function meanRecentQ(sr) {

  return s / k;
}
function consults(W, pub, pr, mem, list, decisionWeek) {

    const c = W.cases[sr.consult.open];

    if (!decisionWeek && !(c.deadlineTick <= t + 4)) continue;       // otherwise decided at the 4-week decision (before the deadline)
    if (c.result === 'agreed' || (c.batches && c.batches.some((b) => b.result === 'agreed'))) continue;   // one agreed batch
    let ext = false;

      else if (pr.extension === 'quality') ext = meanRecentQ(sr) >= 60;

    let r = null;
    if (ext) r = act(W, 'decideCase', {pid, cId: c.id, choice: 'agree', n: 12, purpose: '新章', by: 'delegation'});
    if (!ext || !r || !r.ok || r.result === 'rejected') act(W, 'decideCase', {pid, cId: c.id, choice: 'author', by: 'delegation'});

}

// ------------------------------------------------------------------------------------------------ 8.3.1 release re-evaluation (4-weekly)
// The first choice is the market's shared chooser (mkt.logistics, D-47). A re-evaluation scores the current week against the
// chooser's window from now with the same 8.3.1 score (public items only) and moves only when the best alternative beats
// the current week by more than the change fee; at most 2 changes per volume (own count, free pre-announcement moves included).
// §8.3.1 through the market's shared chooser score (MKT-01 / BAL-07: margin-share delay cost, own-volume externality,
// planned promo), so a re-evaluation does not move a volume back next to its own look-alike (cross-track B)
function weekScorer(W, v, std, um) {
  if (typeof CH.mkt.releaseWeekScorer === 'function') return CH.mkt.releaseWeekScorer(W, v.id, {publicOnly: true, includeOwn: true});
  const maxD = S(W, 'rival_ai_schedule_max_delay');
  return (w, eRef) => std * CH.mkt.attentionAt(W, v.id, w, {publicOnly: true, includeOwn: true}) * um - 50000 * (w - eRef) - 0.1 * std * um * (maxD > 0 ? (w - eRef) / maxD : 0);
}
function reconsider(W, pub, mem, sr, v) {
  const t = W.tick, gap = S(W, 'same_series_release_gap'), w0 = v.releaseTick;
  let lo = t + S(W, 'first_print_lead_weeks'), hi = Infinity;
  for (const vid of sr.volIds) {
    const r = W.vols[vid]; if (!r || r.arc) continue;
    if (r.no === v.no - 1 && (r.status === 'scheduled' || r.status === 'released')) lo = Math.max(lo, (r.status === 'released' ? r.firstReleaseTick : r.releaseTick) + gap);
    if (r.no === v.no + 1 && r.status === 'scheduled') hi = r.releaseTick - gap;
  }
  const f = CH.mkt.forecast(W, v.id), std = f && typeof f.std === 'number' ? f.std : 0;
  if (!(std > 0)) return null;
  const um = v.priceP * S(W, 'paper_publisher_receipt_rate') - S(W, 'paper_manufacturing_unit_cost') - v.priceP * v.royaltyRate;
  const score = weekScorer(W, v, std, um); if (!score) return null;
  const eRef = Math.min(lo, w0), s0 = score(w0, eRef);
  const fee = v.announceTick !== null && v.announceTick < t ? S(W, 'schedule_change_cost') : 0;
  let best = w0, bs = s0 + fee;
  for (let w = lo; w <= lo + S(W, 'rival_ai_schedule_max_delay') && w <= hi; w++) {
    if (w === w0) continue;
    const s = score(w, eRef);
    if (s > bs + 1e-9) { bs = s; best = w; }                         // tie → keep the current week, then earlier
  }
  if (best === w0) return null;
  const r = act(W, 'changeRelease', {pid: pub.id, volId: v.id, tick: best});
  if (r && r.ok) { mem.changes[v.id] = (mem.changes[v.id] || 0) + 1; return best; }
  return null;
}
function reevaluate(W, pub, mem, list) {
  const t = W.tick, pid = pub.id, sched = (W.public && W.public.schedule) || [];
  if (!mem.changes) mem.changes = {};
  const fresh = [];
  for (const e of sched) if (e.pubId !== pid && !e.released && mem.seen[e.volId] !== e.releaseTick) fresh.push(e);
  if (fresh.length && C.has('mkt', 'attentionAt') && C.has('mkt', 'forecast') && A.changeRelease) {
    const lock = S(W, 'schedule_lock_weeks');
    for (const sr of list) {
      for (let i = sr.volIds.length - 1; i >= 0; i--) {
        const v = W.vols[sr.volIds[i]];
        if (!v || v.arc || v.status === 'released') break;
        if (v.status !== 'scheduled' || !(t < v.releaseTick - lock) || (mem.changes[v.id] || 0) >= 2) continue;
        if (!fresh.some((e) => Math.abs(e.releaseTick - v.releaseTick) <= 1)) continue;
        reconsider(W, pub, mem, sr, v);
      }
    }
  }
  const seen = {};
  for (const e of sched) if (e.pubId !== pid && !e.released) seen[e.volId] = e.releaseTick;
  mem.seen = seen;
  for (const id of Object.keys(mem.changes).sort(C.idCompare)) { const v = W.vols[id]; if (!v || v.arc || v.status !== 'scheduled') delete mem.changes[id]; }
}

// ------------------------------------------------------------------------------------------------ 8.4.2 continuation
function median(xs) {
  if (!xs.length) return 0;
  const a = xs.slice().sort((x, y) => x - y), h = a.length >> 1;
  return a.length % 2 ? a[h] : (a[h - 1] + a[h]) / 2;
}
function continuation(W, pub, pr, mem, list) {
  const pid = pub.id;
  for (const m of activeMags(W, pub)) {
    const iss = m.lastIssue;
    if (iss && iss.entries && mem.lastSurveyTick[m.id] !== iss.tick) {     // one survey per issue = one review
      mem.lastSurveyTick[m.id] = iss.tick;
      const ranked = iss.entries.filter((e) => e.srId && !e.pitchId && !e.hole && !e.reprintOf && e.rank !== null && e.rank !== undefined);
      const n = iss.entries.filter((e) => e.rank !== null && e.rank !== undefined).length;
      for (const e of ranked) mem.surveyStreakLow[e.srId] = n >= 3 && e.rank >= n - 1 ? (mem.surveyStreakLow[e.srId] || 0) + 1 : 0;
    }
    const run = list.filter((sr) => sr.magId === m.id && sr.status === 'running');
    if (run.length < 2) continue;
    const lat = (sr) => (C.has('mag', 'latentPower') ? CH.mag.latentPower(W, sr.id) : 0);
    const med = median(run.map(lat));
    for (const sr of run) {
      if (sr.id === pub.flagshipSeriesId || sr.pubCount < pr.cancelMinPub || (mem.surveyStreakLow[sr.id] || 0) < 3) continue;
      if (!(lat(sr) < 0.7 * med)) continue;
      const r = act(W, 'cancelSeries', {pid, srId: sr.id, reason: 'rival'});
      if (r && r.ok) { delete mem.surveyStreakLow[sr.id]; break; }        // at most one per magazine per decision
    }
  }
}

// ------------------------------------------------------------------------------------------------ 8.4.3 new serials
function qHat(W, p, au) {                                            // expected Q from concept & skills (common formula, gain 0)
  const sk = au.skill, cc = p.concept || [0, 0, 0, 0], M = au.M === undefined ? 65 : au.M;
  const story = clamp(0.70 * sk[0] + 0.30 * cc[0] + 0.04 * (M - 65), 0, 100);
  return S(W, 'quality.story_weight') * story + S(W, 'quality.art_weight') * (0.7 * sk[1] + 0.3 * cc[1])
    + S(W, 'quality.character_weight') * (0.7 * sk[2] + 0.3 * cc[2]) + S(W, 'quality.readability_weight') * (0.7 * sk[3] + 0.3 * cc[3]);
}
R.qHat = (W, p) => { const au = p.auth || (p.authorId ? W.authors[p.authorId] : null); return au ? qHat(W, p, au) : 0; };
function startCounts(W, pid, list, t) {                              // public starts in the last 52 weeks + own (predicted freshness)
  const ty = {}, pair = {};
  const add = (ti, si) => { ty[ti] = (ty[ti] || 0) + 1; pair[ti * 60 + si] = (pair[ti * 60 + si] || 0) + 1; };
  const ps = (W.public && W.public.series) || {};
  for (const id of Object.keys(ps).sort(C.idCompare)) {
    const s = ps[id];
    if (s.pubId !== pid && s.startTick !== null && s.startTick !== undefined && s.startTick > t - 52 && s.startTick <= t) add(s.typeIdx, s.themeIdx);
  }
  for (const sr of list) if (sr.startTick !== null && sr.startTick !== undefined && sr.startTick > t - 52 && sr.startTick <= t) add(sr.typeIdx, sr.themeIdx);
  return {ty, pair};
}
function freePagesOwn(W, m, list, strict) {
  let used = 0;
  for (const sr of list) {
    if (sr.magId !== m.id || !OCCUPY.has(sr.status)) continue;
    if (!strict && sr.status === 'ending' && sr.H - sr.pubCount <= 2) continue;   // its pages free within about two issues
    used += sr.pages * (sr.everyN === 2 ? 0.5 : 1);
  }
  return m.pageBudget - used;
}
function editorFor(W, pub, pr, mem) {
  let best = null, bn = 3;
  for (const id of pub.editorIds.slice().sort(C.idCompare)) {
    const e = W.editors[id]; if (!e) continue;
    const n = C.has('auth', 'activeAssignments') ? CH.auth.activeAssignments(W, id) : e.seriesIds.length;
    if (n < bn) { bn = n; best = e; }
  }
  if (best) return best;
  if (mem.distress >= 2 || !A.hireEditor) return null;               // level 2+: no hires
  let slots = 0; for (const m of activeMags(W, pub)) slots += Math.floor(m.pageBudget / 32);
  if (pub.editorIds.length >= Math.ceil(slots / 3) + 1) return null;  // anti-snowball cap
  if (!(pub.cash > 13 * (C.fixedWeekly(W, pub.id) + S(W, 'start.editor_salary')))) return null;
  const pool = C.has('auth', 'hirePool') ? CH.auth.hirePool(W, pub.id) : pub.hirePool || [];
  if (!pool.length) return null;
  let bi = 0; for (let i = 1; i < pool.length; i++) if (pool[i].skill > pool[bi].skill) bi = i;
  const r = A.hireEditor(W, {pid: pub.id, index: bi});
  return r && r.ok ? W.editors[r.editorId] : null;
}
function isRookie(W, p) {
  if (p.auth) return p.auth.kind === 'rookie' || p.auth.kind === 'gem';
  return false;
}
function adopt(W, pub, pr, mem, list) {
  if (!A.adoptPitch) { C.recordStub(W, 'act.adoptPitch'); return 0; }
  const t = W.tick, pid = pub.id, strict = mem.distress >= 2;
  const mags = activeMags(W, pub).filter((m) => m.id !== mem.closingMagId); if (!mags.length) return 0;
  const free = {}; for (const m of mags) free[m.id] = freePagesOwn(W, m, list, strict);
  const pitches = [];
  for (const id of C.ids(W, 'pitches')) { const p = W.pitches[id]; if (p.pubId === pid && p.status === 'open' && t < p.expiresTick) pitches.push(p); }
  if (!pitches.length) return 0;
  const sc = pr.freshPref ? startCounts(W, pid, list, t) : null, fav = favIdx(pr), skip = {};
  let n = 0;
  for (let round = 1; round <= 12; round++) {
    if (!(pub.cash > 13 * C.fixedWeekly(W, pid))) break;
    const cands = mags.filter((m) => free[m.id] >= 32);
    if (!cands.length) break;
    const rookieOnly = pr.rookieShare > 0 && C.rng(W, t, pid, 'rival', 100 + round) < pr.rookieShare;
    let best = null;
    for (const pass of rookieOnly ? [true, false] : [false]) {
      for (const p of pitches) {
        if (skip[p.id] || p.status !== 'open' || (pass && !isRookie(W, p))) continue;
        if (C.pairScore(p.typeIdx, p.themeIdx) <= pr.minScore) continue;
        const au = p.auth || (p.authorId ? W.authors[p.authorId] : null); if (!au || !au.skill) continue;
        const w = C.comboW(W, p.typeIdx, p.themeIdx);
        let ff = 1;
        if (sc) ff = clamp(75 - 8 * (sc.pair[p.typeIdx * 60 + p.themeIdx] || 0) - 1.5 * (sc.ty[p.typeIdx] || 0) + (p.originality || 0), 10, 95) / 75;
        const base = (0.5 + 0.5 * qHat(W, p, au) / 100) * (fav.includes(p.typeIdx) ? 1.2 : 1) * ff;
        for (const m of cands) {
          if (free[m.id] < (p.pages || 32)) continue;
          const s = C.cos6(w, m.w) * base;
          if (!best || s > best.s + 1e-12) best = {p, m, s};
        }
      }
      if (best) break;
    }
    if (!best) break;
    const ed = editorFor(W, pub, pr, mem); if (!ed) break;
    const args = {pid, ptId: best.p.id, magId: best.m.id, editorId: ed.id, feeFactor: pr.offerFee};
    let r = A.adoptPitch(W, args);
    if (r && !r.ok && r.err === 'capacity') r = A.adoptPitch(W, Object.assign({}, args, {prepOnly: true}));   // D-99: prepare until pages free
    skip[best.p.id] = true;
    if (!r || !r.ok) continue;
    n++;
    free[best.m.id] -= best.p.pages || 32;
    const sr = W.series[r.srId]; if (sr) list.push(sr);
  }
  return n;
}

// ------------------------------------------------------------------------------------------------ 8.6 level 3 (borrow, magazine consolidation, rebuild)
function distress3(W, pub, pr, mem, list) {
  const t = W.tick, pid = pub.id, unit = S(W, 'finance.loan_unit');
  const cap = C.loanCap(W, pid);
  if (cap >= unit) act(W, 'borrow', {pid, units: Math.floor(cap / unit)});
  if (activeMags(W, pub).length === 2 && !mem.closingMagId) {
    const mags = activeMags(W, pub);
    const sales = (m) => (m.lastIssue && typeof m.lastIssue.sales === 'number' ? m.lastIssue.sales : m.prevSales || 0);
    mem.closingMagId = sales(mags[1]) <= sales(mags[0]) ? mags[1].id : mags[0].id;      // 休刊 the lower-selling one (tie → later id)
  }
  if (pub.cash < 0 && (pub.shortfallWeeks || 0) >= SHORTFALL_L3 + REBUILD_AFTER
    && (mem.lastRebuildTick === null || t - mem.lastRebuildTick >= REBUILD_INTERVAL)) {   // 再建融資 (never removed)
    // BAL-14: a normal loan outside the loan cap (interest, repaid by the quarterly cash policy); x.rival.rebuild_loan = false: a gift
    if (X(W, 'x.rival.rebuild_loan')) pub.loans.push({id: C.newId(W, pub, 'ln'), principal: REBUILD_AMOUNT, tick: t, rebuild: true});
    C.book(W, pid, 'loan_in', REBUILD_AMOUNT, {accrue: false});
    mem.rebuildCount++; mem.lastRebuildTick = t;
    C.notify(W, 'p0', 'log', 'rival_rebuild', pub.name + 'が再建計画を発表しました。', null);
  }
}
function consolidate(W, pub, mem, list) {                          // once started, continues weekly until the magazine is closed
  const pid = pub.id, lo = W.mags[mem.closingMagId];
  const hi = activeMags(W, pub).find((m) => m.id !== mem.closingMagId) || null;
  if (!lo || lo.status !== 'active' || !hi) { mem.closingMagId = null; return; }
  for (const sr of list.slice()) {
    if (sr.magId !== lo.id || !OCCUPY.has(sr.status)) continue;
    const r = act(W, 'transferSeries', {pid, srId: sr.id, toMagId: hi.id});
    if (r && r.ok && r.pending && r.caseId) {                        // agreed moves only; otherwise the serial ends
      const d = act(W, 'decideCase', {pid, cId: r.caseId, choice: 'agree', by: 'delegation'});
      if (!(d && d.ok && d.agreed) && LIVE.has(sr.status)) act(W, 'cancelSeries', {pid, srId: sr.id, reason: 'rival_distress'});
    } else if ((!r || !r.ok) && LIVE.has(sr.status)) act(W, 'cancelSeries', {pid, srId: sr.id, reason: 'rival_distress'});
  }
  if (!list.some((sr) => sr.magId === lo.id && OCCUPY.has(sr.status))) {
    const r = act(W, 'closeMagazine', {pid, magId: lo.id});
    if (r && r.ok) mem.closingMagId = null;
  }
}

// ------------------------------------------------------------------------------------------------ 8.7 quarterly cash policy (BAL-02, BAL-14, AC-10)
// Rival cash used to pile up without limit (8–15 B yen by 2025: promo is capped by revenue, page budgets are fixed and rivals do
// not found magazines). Each quarter a rival out of distress keeps a reserve — x.rival.reserve_rev × its trailing-52-week revenue,
// at least x.rival.reserve_weeks × its fixed weekly cost — repays loans from the surplus, then pays out x.rival.payout_rate of
// what is left (配当・親会社への還元, cash only: not an operating expense). Its market behaviour does not change.
function cashPolicy(W, pub, pr, mem) {
  const t = W.tick, pid = pub.id;
  if (mem.distress > 0 || t % 13 !== 0 || t === 0) return 0;
  const rev52 = C.pl(W, pid, 52).rev, rev52a = rev52 * 52 / Math.min(52, t + 1);
  const reserve = Math.max(X(W, 'x.rival.reserve_rev') * rev52a, X(W, 'x.rival.reserve_weeks') * C.fixedWeekly(W, pid));
  const unit = S(W, 'finance.loan_unit');
  const principal = C.loanPrincipal(W, pid);
  if (principal > 0 && pub.cash - reserve >= unit && A.repay) {
    const units = Math.min(Math.ceil(principal / unit), Math.floor((pub.cash - reserve) / unit));
    if (units > 0) act(W, 'repay', {pid, units});
  }
  const excess = pub.cash - reserve;
  if (!(excess > 0) || C.loanPrincipal(W, pid) > 0) return 0;
  const amt = Math.floor(X(W, 'x.rival.payout_rate') * excess / 100000) * 100000;
  if (amt <= 0) return 0;
  C.book(W, pid, 'dividend', -amt, {accrue: false});
  mem.paidOut = (mem.paidOut || 0) + amt;

U.parseRoute = (hash) => {

    const ps = pat.split('/'); if (ps.length !== segs.length) continue;

    for (let i = 0; i < ps.length; i++) { if (ps[i][0] === ':') params[ps[i].slice(1)] = decodeURIComponent(segs[i]); else if (ps[i] !== segs[i]) { ok = false; break; } }

function editorShortHint(W, need) {                                // CM-07: a plan that editor capacity cannot fill (担当は1人3作品まで, 5.4.2)
  if (!(need > 0)) return '';
  let free = 0; for (const e of IDX.editors(W)) free += Math.max(0, 3 - (e.n || 0));
  if (free >= need) return '';
  return '<p class="warn">編集者が不足しています（担当は1人3作品まで）。あと' + int(need) + '本の連載が必要ですが、担当の空きは' + int(free) + '本分です。'
    + '創刊するには「' + link('経営', '#finance') + '」画面で編集者を採用してください。</p>';
}

    case 'moved': return nm + 'は別の雑誌で準備中です';

};

// ------------------------------------------------------------------------------------------------ #vols 単行本 (10.3)
function bdFunnel(b, title) {                                      // 6.12: every candidate ends in exactly one state (sold / waiting / skipped this time); MKT-14
  if (!b || !b.arrived) return '<p class="muted">' + esc(title) + ': まだ記録がありません。</p>';
  const r = Object.assign({comp: 0, budget: 0, stockout: 0}, b.reasons || {}), sb = Object.assign({comp: 0, budget: 0, stockout: 0}, b.skipBy || {});
  const now = (b.newC || 0) + (b.followC || 0) + (b.catchC || 0), waited = Math.max(0, (b.arrived || 0) - now);
  const afterComp = b.arrived - r.comp - r.budget;
  const rows = [['購入希望（新規・追随・追いつき・待機）', b.arrived, ''], ['競合で今週は買わない（注目の分散）', r.comp, 'neg'], ['予算・価格で今週は買わない', r.budget, 'neg'],
    ['紙の品切れで買えない', r.stockout, 'neg'], ['実売', b.sold, 'ok']];
  if (b.toDigital > 0) rows.push(['うち電子', b.toDigital, ''], ['うち紙', Math.max(0, b.sold - b.toDigital), '']);
  rows.push(['来週以降も待つ', b.wait, ''], ['今回見送り（この巻は買わない）', b.skip, 'neg']);
  const mx = Math.max(1, ...rows.map((x) => x[1] || 0));
  let s = '<div class="sub-h">' + esc(title) + '</div><p class="k">購入希望 ' + esc(cnt(b.arrived)) + ' → 競合・予算のあと今週 ' + esc(cnt(afterComp)) + ' → 紙の品切れのあと実売 ' + esc(cnt(b.sold))
    + '／来週以降も待つ ' + esc(cnt(b.wait)) + '／今回見送り ' + esc(cnt(b.skip)) + '</p><div class="funnel">';
  for (const x of rows) s += '<div><span>' + x[0] + '</span><span class="fb ' + x[2] + '"><i style="width:' + ((x[1] || 0) / mx * 100).toFixed(1) + '%"></i></span><span class="num">' + esc(cnt(x[1] || 0)) + '</span></div>';
  s += '</div><p class="k">購入希望の内訳: 新規 ' + grp(b.newC || 0) + ' / 既刊からの追随 ' + grp(b.followC || 0) + ' / 追いつき ' + grp(b.catchC || 0) + ' / 以前から待っていた ' + grp(waited) + '冊。'
    + '実売のうち待っていた読者 ' + grp(b.soldFromWait || 0) + '冊。今回見送りの理由: 競合 ' + grp(sb.comp) + '冊 / 品切れ ' + grp(sb.stockout) + '冊 / 予算 ' + grp(sb.budget) + '冊（実シミュレーションの値）</p>';
  return s;
}

      ['作品貢献利益', isNum(vc.contributionYen) ? '<span class="' + plCls(vc.contributionYen) + '">' + esc(syen(vc.contributionYen)) + '</span><small class="muted">（原稿料配賦後）</small>' : valHtml(vc.contributionYen, '')]]);

U.views.vols = (W, p) => {
  const n = Math.max(12, +(p.q && p.q.n) || 24), t = W.tick;

U.mediaGoalHtml = (W) => {
  if (!helper('media', 'eligibility') || !C.S) return '';
  const st = (k) => safe(() => C.S(W, k), null);
  const cumMin = st('media.eligibility_cumulative_sales'), recMin = st('media.eligibility_recent_sales'), awMin = st('media.eligibility_awareness');
  if (!isNum(cumMin) || !isNum(recMin) || !isNum(awMin)) return '';
  const fmts = ['anime', 'drama', 'film'];
  const stock = fmts.map((f) => MEDIA_FMT_JA[f] + ' ' + int(st('media.' + f + '.stock_min')) + '巻').join('・');
  let s = '<p class="k">打診は13週ごとに、次の実績を満たした作品へ一定の確率で届きます（作品と形式の相性が高いほど届きやすくなります）。</p>'
    + '<div class="lst"><div><span>紙＋電子有料の累計</span><span>' + esc(cnt(cumMin, '部')) + '以上</span></div>'
    + '<div><span>または 発売から13週たった最新巻の13週実売</span><span>' + esc(cnt(recMin, '部')) + '以上＋認知度' + int(awMin) + '%以上</span></div>'
    + '<div><span>あわせて 既刊</span><span>' + esc(stock) + '以上</span></div></div>';
  const own = Object.keys(W.series || {}).sort(C.idCompare).map((id) => W.series[id])
    .filter((sr) => sr && sr.pubId === 'p0' && (sr.volIds || []).length && sr.status !== 'cancelled');
  const rows = [];
  for (const sr of own) {
    const el = safe(() => CH.media.eligibility(W, sr.id), null);
    if (el && el.stats) rows.push({sr, el});
  }
  rows.sort((a, b) => (b.el.stats.cum - a.el.stats.cum) || (a.sr.id < b.sr.id ? -1 : a.sr.id > b.sr.id ? 1 : 0));
  const top = rows.slice(0, 3);
  if (!top.length) return card('打診が届く条件', s + empty('単行本を出している作品がまだありません。'));
  const prog = (v, of) => Math.min(100, Math.floor(v / of * 100)) + '%<br><small class="muted">' + esc(cnt(Math.round(v), '部')) + '</small>';
  // a short table (4 columns) so it fits a phone without scrolling; the state goes under the title
  s += table([['作品', 'l'], ['累計', 'l'], ['最新巻13週・認知度', 'l'], ['既刊']], top.map(({sr, el}) => {
    const ok = el.formats.filter((f) => f.eligible).map((f) => MEDIA_FMT_JA[f.fmt]);
    const first = el.formats.find((f) => !f.eligible);
    const why = ok.length ? '条件を満たしています（' + ok.join('・') + '）' : first ? (MEDIA_REASON_JA[first.reason] || first.reason) : '—';
    return tr([[link(esc(sr.name), '#series/' + sr.id) + '<br><small class="' + (ok.length ? 'good' : 'muted') + '">' + esc(why) + '</small>', 'l'], [prog(el.stats.cum, cumMin), 'l'], [prog(el.stats.last13, recMin) + '<br><small class="muted">認知度 ' + pctv(el.awareness) + '</small>', 'l'],
      int(el.stats.published) + '巻']);
  }), {label: '映像化の条件への進み具合'});
  s += '<p class="k">割合は条件（累計' + esc(cnt(cumMin, '部')) + '・最新巻13週' + esc(cnt(recMin, '部')) + '）に対する進み具合です。</p>';
  return card('打診が届く条件', s);
};

  }
  s += card('届いている打診', g ? '<div class="grid2">' + g + '</div>' : empty('いま届いている打診はありません。打診は13週ごとに、実績のある作品へ届きます。'));

      + kv([['発表', esc(dt(c.announceTick, W))], [c.format === 'film' ? '公開' : '放送', esc(dt(c.releaseTick, W))], ['作者合意', esc(c.consent ? c.consent.label : '—')], ['監修負荷', isNum(c.supervisionLoad) ? Math.round(c.supervisionLoad * 100) + '%' : '—'],
        ['許諾料（受取済）', esc(yen(c.feeReceivedYen))], ['許諾料（予定）', esc(yen(c.feePlannedYen))], ['期待の幅', c.sRange ? Math.round(c.sRange[0]) + '〜' + Math.round(c.sRange[1]) : '—'], ['使用予定巻', c.cover ? c.cover.from + '〜' + c.cover.to + '巻' : '—']])

      + (c.catchUp && c.catchUp.open ? '<div class="sub-h">原作に追いつきそうです（' + esc(dt(c.catchUp.deadlineTick, W)) + 'まで）</div><div class="row">' + c.catchUp.choices.map((k) => btn(esc((lb('media', {}).catchUp || {})[k] || k), 'mediaCatchupChoice', {mdId: id, choice: k}, {cls: k === 'delay' ? '' : 'sub', ok: '決定しました'})).join('') + '</div>' : '')

      + '</article>';
  }
  s += card('進行中', a ? '<div class="grid2">' + a + '</div>' : empty('進行中の映像化はありません'));
  const past = (ml.past || []).map((id) => sel('mediaCard', W, id, {viewerPid: 'p0'})).filter((c) => c && !bad(c));
  if (past.length) s += card('終了・見送り', '<div class="lst">' + past.map((c) => '<div><span>『' + esc(c.seriesName) + '』' + esc(c.formatLabel) + '</span><span>' + esc(c.phaseLabel) + '</span></div>').join('') + '</div>');

  const pubAll = (ml.public || []).map((id) => sel('mediaCard', W, id, {viewerPid: 'p0'})).filter((c) => c && !bad(c));
  const pub = pubAll.slice().sort((a, b) => ((isNum(b.releaseTick) ? b.releaseTick : -1) - (isNum(a.releaseTick) ? a.releaseTick : -1))).slice(0, 12);

};

// ------------------------------------------------------------------------------------------------ #market 市場 (6.10, U01)
U.views.market = (W) => {
  const rows = sel('marketTable', W);
  let s = head('市場', '公開情報と推定値。自社の数字は「確定」');
  if (bad(rows)) return s + prep(rows, '市場の表');
  s += '<p class="k">他社の数字はすべて推定（範囲と時点つき）または公表値です。自社の行は ' + tag('確定', 'own') + ' と背景色で区別しています。</p>';
  const list = (rows || []).slice().sort((a, b) => (b.own - a.own) || (a.pubId < b.pubId ? -1 : a.pubId > b.pubId ? 1 : 0));
  // UX-11: the title and the sales come first (the first column stays visible on phones); genre/author/media follow
  const out = list.filter((r) => r.status !== 'finished' && r.status !== 'cancelled' || r.own).slice(0, 160).map((r) => tr([
    [(r.own ? tag('確定', 'own') + ' ' + link(esc(r.name), '#series/' + r.srId) : esc(r.name)) + '<br><small class="muted co"><span>' + esc((W.pubs[r.pubId] || {}).name || r.pubId) + (r.magName ? '・</span><span>' + esc(r.magName) : '') + '</span></small>', 'l'],
    [r.own ? valHtml(r.life) + '<br><small class="muted">' + esc(lb('cum', '紙＋電子有料累計')) + '</small>' : valHtml(r.life), 'l'],
    [r.four && r.four.kind === 'estimated' ? '推定 ' + esc(r.four.label) + '<br>' + valHtml(r.four) : r.four && r.four.kind === 'exact' ? esc(r.four.label || '') + ' ' + valHtml(r.four) : valHtml(r.four), 'l'],
    [valHtml(r.week), 'l'],
    esc(STATUS_JA[r.status] || r.status || '—'), int(r.vols) + '巻', esc(r.nextRelease !== null && r.nextRelease !== undefined ? dt(r.nextRelease, W) : '—'), r.priceP ? r.priceP + '円' : '—',
    [esc(comboName(r.typeIdx, r.themeIdx)), 'l'], [esc(r.author || '—') + (r.nextWorkOpen ? '<br>' + tag('次回作の交渉が可能', 'gold') : ''), 'l'],
    [(r.mediaPublic || []).map((m) => esc(typeof m === 'string' ? m : (m.formatLabel || m.format || ''))).join('・') || '—', 'l']], r.own ? 'own' : ''));
  s += table([['作品（会社・雑誌）', 'l'], ['累計（公開）', 'l'], ['最新巻4週', 'l'], ['週間', 'l'], ['状態'], ['既刊'], ['次の発売'], ['定価'], ['タイプ×題材', 'l'], ['作者', 'l'], ['映像化', 'l']], out, {label: '市場の作品一覧', cls: 'mkt'});
  return s;
};

U.views.finance = (W) => {
  const f = sel('finance', W);
  let s = head('経営', '資金・借入・損益・人員');
  if (bad(f) || !f) return s + prep(f, '経営の画面');
  const unit = DATA.settings['finance.loan_unit'] || 5000000, debt = (f.loans || []).reduce((a, l) => a + l.principal, 0);
  let g = card('資金と借入', kv([['現金', '<span class="' + (f.cashYen < 0 ? 'bad' : '') + '">' + esc(yen(f.cashYen)) + '</span>'], ['借入残高', esc(yen(debt))], ['借入枠', esc(yen(f.loanCapYen))],
    ['未入金（受取予定）', esc(yen(f.unpaidYen))], ['未払予定', esc(yen(f.payablesYen))], ['固定費/週', esc(yen(f.fixedWeeklyYen))]])
    + (f.loanReason ? '<p class="warn">' + esc(f.loanReason) + '</p>' : '')
    + '<div class="row">' + btn('借入 ' + esc(yen(unit)), 'borrow', {units: 1}, {disabled: f.loanCapYen < unit, confirm: yen(unit) + 'を借り入れますか？（週0.1%の利息）', ok: '借り入れました'})
    + btn('返済 ' + esc(yen(unit)), 'repay', {units: 1}, {cls: 'sub', disabled: !debt, ok: '返済しました'}) + '</div>'
    + '<p class="k">借入枠は直近52週の売上・許諾料の入金の50%から借入残高を引いた額です。</p>');
  // P/L
  const cats = (V.LABELS && V.LABELS.cat) || {};
  const keys = new Set(); for (const w of ['w4', 'w13', 'w52']) for (const k of Object.keys((f.pl || {})[w] || {})) keys.add(k);
  const order = Array.from(keys).sort((a, b) => ((f.pl.w52[b] || 0) > 0) - ((f.pl.w52[a] || 0) > 0) || Math.abs(f.pl.w52[b] || 0) - Math.abs(f.pl.w52[a] || 0));
  const rows = order.map((k) => tr([[esc(cats[k] || k), 'l'], ...['w4', 'w13', 'w52'].map((w) => '<span class="' + plCls(f.pl[w][k]) + '">' + esc(syen(f.pl[w][k] || 0)) + '</span>')]));
  if (f.net) rows.push(tr([['損益', 'l'], ...['w4', 'w13', 'w52'].map((w) => '<span class="' + plCls(f.net[w]) + '">' + esc(syen(f.net[w])) + '</span>')], 'sum'));
  g += card('損益（発生ベース・カテゴリ別）', table([['', 'l'], ['4週'], ['13週'], ['52週']], rows, {label: '損益'}) + '<p class="k">損益は発生ベース、現金は入金・支払ベースです。黒字でも入金待ちで資金不足になることがあります。</p>', 'span2');
  // magazines: standalone vs department
  let mp = '', deptLabel = '';
  for (const m of IDX.mags(W)) {
    if (m.status === 'planned') continue;
    const c = sel('magazineCard', W, m.id); if (bad(c) || !c) continue;
    if (!deptLabel && c.deptPL && c.deptPL.label) deptLabel = c.deptPL.label;
    mp += tr([[link(esc(c.name), '#mag/' + c.id), 'l'], '<span class="' + plCls(c.magPL.revYen - c.magPL.costYen) + '">' + esc(syen(c.magPL.revYen - c.magPL.costYen)) + '</span>',
      '<span class="' + plCls(c.deptPL.revYen - c.deptPL.costYen) + '">' + esc(syen(c.deptPL.revYen - c.deptPL.costYen)) + '</span>']);
  }
  g += card('雑誌単体と部門の収支', mp ? table([['雑誌', 'l'], ['雑誌単体'], ['部門（単行本込み）']], [mp]) + (deptLabel ? '<p class="k">部門: ' + esc(deptLabel) + '。雑誌単体は直近の号の合計です。</p>' : '') : empty('—'));
  g += card('販売先と設備', kv([['販売先信頼', int(f.trust) + ' / 100'], ['編集部の処理能力', '+' + int(f.capacityBonus)]])
    + '<p class="k">販売先信頼は発売日変更などで下がります。</p><div class="row">' + btn('処理能力を増強（+5・200万円）', 'investCapacity', {}, {cls: 'sub', confirm: '200万円で編集部の処理能力を+5しますか？', ok: '増強しました', disabled: f.capacityBonus >= 20}) + '</div>');
  // editors
  const eds = IDX.editors(W);
  let er = eds.map((e) => {                                        // UX-06: the coming issue-week peak, last week's load, and the streak warning
    const pk = IDX.editorPeak(W, e.id), capTxt = isNum(e.cap) ? '/' + int(e.cap) : '';
    const warn = e.streak >= 4 ? tag('過負荷が' + int(e.streak) + '号続く・担当の見直しを', 'bad') : pk && pk.over ? tag('掲載週に過負荷', 'warn') : '';
    return tr([[avatarPortrait(W, 'editor', e.id, e.name) + esc(e.name), 'l'], int(e.skill), int(e.n) + '/3', pk ? '<span class="' + (pk.over ? 'bad' : '') + '">' + int(pk.peak) + '/' + int(pk.cap) + '</span>' : '—', int(e.load) + capTxt, warn,
      btn('解雇', 'fireEditor', {eId: e.id}, {cls: 'danger small', disabled: e.n > 0, confirm: e.name + 'を解雇しますか？（退職金4週分）'})]);
  });
  const pool = (helper('auth', 'hirePool') ? safe(() => CH.auth.hirePool(W, 'p0'), null) : null) || ((IDX.pub(W) || {}).hirePool) || [];
  let hp = pool.map((c, i) => '<div><span>' + avatarPortrait(W, 'candidate', c, c.name) + esc(c.name || '候補' + (i + 1)) + ' <small class="muted">能力 ' + int(c.skill) + ' · 得意 ' + esc((c.favTypes || []).map(typeName).join('・')) + '</small></span>'
    + btn('雇う', 'hireEditor', {index: i}, {cls: 'small', ok: '採用しました'}) + '</div>').join('');
  g += card('編集者（' + eds.length + '人）', table([['名前', 'l'], ['能力'], ['担当'], ['掲載週の負荷/上限'], ['先週の負荷'], [''], ['']], er) + loadNote(W) + '<div class="sub-h">採用候補（13週ごとに入れ替わり）</div><div class="lst">' + (hp || '<div class="muted">候補なし</div>') + '</div>', 'span2');
  // assistants
  const as = IDX.assistants(W), srs = IDX.series(W).filter((x) => ACTIVE_SR.has(x.status));
  let ar = as.map((a) => '<div><span>アシスタント ' + esc(a.id) + ' <small class="muted">' + Object.keys(a.alloc).map((k) => esc(IDX.seriesName(W, k)) + ' ' + Math.round(a.alloc[k] * 100) + '%').join('、') + '</small></span>'
    + btn('解雇', 'fireAssistant', {asId: a.id}, {cls: 'danger small', confirm: 'このアシスタントとの契約を終えますか？'}) + '</div>').join('');
  g += card('アシスタント', '<div class="lst">' + (ar || '<div class="muted">いません</div>') + '</div>' + (srs.length ? '<div class="form" id="ha">' + field('作品', selectEl('srId', srs.map((x) => [x.id, x.name]), srs[0].id))
    + field('配分', selectEl('share', [[1, '100%'], [0.5, '50%']], 1, {t: 'num'})) + '</div><div class="foot">' + btn('雇う（8万円/週）', 'hireAssistant', {}, {form: 'ha', ok: '雇いました'}) + '</div>' : ''));
  // promos
  const pr = IDX.promos(W);
  g += card('実施中の宣伝', pr.length ? '<div class="lst">' + pr.map((x) => '<div><span>' + esc(CHANNEL_JA[x.channel] || x.channel) + ' · ' + esc(IDX.promoTargetName(W, x.target))
    + ' <small class="muted">' + esc(yen(x.weekly)) + '/週・' + esc(dt(x.untilTick, W)) + 'まで</small></span>' + btn('止める', 'stopPromo', {pcId: x.id}, {cls: 'sub small'}) + '</div>').join('') + '</div>'
    + '<div class="row">' + btn('すべて止める', 'stopPromo', {all: true}, {cls: 'danger small', confirm: '実施中の宣伝をすべて止めますか？'}) + '</div>' : empty('実施中の宣伝はありません'));
  return s + '<div class="grid2">' + g + '</div>';
};

// ------------------------------------------------------------------------------------------------ #notifs 通知 (10.5)
U.views.notifs = (W, p) => {
  const pr = (p.q && p.q.p) || 'urgent';
  const counts = {open: IDX.openItems(W).length, urgent: 0, normal: 0, log: 0};
  for (const n of W.notifs) if (!n.ack || n.prio === 'log') counts[n.prio] = (counts[n.prio] || 0) + (n.prio === 'log' ? 0 : 1);

function capacityOptions(o) {                                     // a page-budget raise that would still leave the issue short is not offered (UX-08)
  const need = isNum(o.pages) && isNum(o.free) ? Math.max(0, o.pages - o.free) : 0, all = o.options || [];
  const bud = all.filter((x) => x.kind === 'budget'), ok = bud.filter((x) => x.pages >= need);
  const out = all.filter((x) => x.kind !== 'budget' || x.pages >= need);
  if (bud.length && !ok.length && need > 0) {                       // none is enough: offer the smallest 16-page step that is
    const per = bud[0].pages > 0 ? bud[0].costPerIssue / bud[0].pages : 0, pg = Math.ceil(need / 16) * 16;
    out.unshift({kind: 'budget', pages: pg, costPerIssue: per * pg});
  }
  return out;
}

  }
  function collectForm(ids) {
    const els = [];
    for (const id of String(ids).split(',')) {
      const root = $(id.trim()); if (!root) continue;
      root.querySelectorAll('input[name],select[name],textarea[name]').forEach((el) => els.push({name: el.name, type: el.type, checked: el.checked, value: el.value, t: el.getAttribute('data-t')}));
    }
    return U.collectInputs(els);
  }
  function parseArgs(s) { if (!s) return {}; try { return JSON.parse(s); } catch (e) { logErr('args', e); return {}; } }
  function deepMerge(a, b) { for (const k of Object.keys(b)) { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) deepMerge(a[k], b[k]); else a[k] = b[k]; } return a; }
  function onAct(el) {
    const name = el.getAttribute('data-act');
    let args = parseArgs(el.getAttribute('data-args'));
    if (el.getAttribute('data-form')) args = deepMerge(args, collectForm(el.getAttribute('data-form')));
    args = U.prepareArgs(name, args);
    const q = [el.getAttribute('data-confirm'), st.W ? U.preConfirm(st.W, name, args) : null].filter(Boolean);
    if (q.length) { st.pending = {name, args, el}; openModal({kind: 'confirm', text: q.join(' ')}); return; }
    runAct(name, args, el);
  }
  // load / new game
  function finishLoad(str, o) {
    let W;
    try { W = C.deserialize(str, o || {}); } catch (e) { toast('読み込めませんでした: ' + (e && e.message), 'err'); return; }
    st.W = W; st.speed = 0; schedule(); st.modal = null; st.shown = new Set(); st.floaters = []; st.pendingLoad = null;
    renderModal();
    if (win.location.hash && win.location.hash !== '#home') goHash('#home'); else renderAll();
    toast('読み込みました（' + C.dateStr(W.tick, W) + '）', 'ok');
    nextPause(); renderAll();
  }
  function loadText(str) {
    str = String(str || '').trim();
    if (!str) { toast('セーブデータが空です', 'err'); return; }
    if (str.slice(0, 5) === 'CHZ2:') { try { str = C.decompressB64(str); } catch (e) { toast('書き出したテキストとして読めません', 'err'); return; } }
    const info = safe(() => C.inspectSave(str), {ok: false, msg: 'セーブデータを読み込めません'});
    if (!info.ok) { toast(info.msg, 'err'); return; }
    if (info.needsGrowthChoice) { st.pendingLoad = str; st.modal = null; openModal({kind: 'growth', info}); return; }
    finishLoad(str, {});
  }
  function startGame() {
    const f = collectForm('ng'), name = String(f.flagshipName || '').trim(), company = String(f.companyName || '').trim() || 'ひよこ書房';
    if (!name) { toast('看板作品の名前を入力してください', 'err'); const el = view.querySelector('[name="flagshipName"]'); if (el) el.focus(); return; }
    if (name.length > 20 || company.length > 20) { toast('名前は20文字以内です', 'err'); return; }
    const seed = isNum(f.seed) ? f.seed : st.seed;
    let W;
    try { W = C.newGame({seed, flagshipName: name, companyName: company}); } catch (e) { logErr('newGame', e); toast('開始できませんでした: ' + (e && e.message), 'err'); return; }
    st.W = W; st.speed = 0; st.shown = new Set(); st.floaters = []; st.modal = null; renderModal();
    autosave(true);
    if (win.location.hash && win.location.hash !== '#home') goHash('#home'); else renderAll();
    renderAll();
  }
  function newSeed() { const a = new Uint32Array(1); try { win.crypto.getRandomValues(a); return a[0] % 1000000000; } catch (e) { return Math.floor(Math.random() * 1e9); } }
  // UI commands (data-ui)
  function uiCmd(cmd, el, ev) {
    const W = st.W, d = (k) => el.getAttribute('data-' + k);
    switch (cmd) {
      case 'step': if (!st.modal || !PAUSE_MODALS.has(st.modal.kind)) doStep(); else toast('先にこの判断を決めるか「あとで決める」を選んでください', 'err'); break;
      case 'speed': setSpeed(+d('v')); break;
      case 'theme': applyTheme(d('v') || (isDark() ? 'light' : 'dark'), true); renderAll(); break;
      case 'sheet': openModal({kind: 'sheet'}); break;
      case 'close': if (st.modal && st.modal.kind === 'confirm' && st.prevModal) { st.modal = st.prevModal; st.prevModal = null; renderModal(); } else closeModal(); break;
      case 'confirm-yes': { const p = st.pending; st.pending = null; st.modal = st.prevModal; st.prevModal = null; renderModal(); if (p) { if (p.ui) p.ui(); else runAct(p.name, p.args, p.el); } break; }
      case 'save': saveTo(d('slot')); renderAll(); break;
      case 'load': { const s = lsGet(skey(d('slot'))); if (!s) { toast('セーブデータがありません', 'err'); break; } loadText(s); break; }
      case 'load-growth': { const s = st.pendingLoad; st.modal = null; if (s) finishLoad(s, {growthChoice: d('choice') === 'old' ? 'old' : 'migrate'}); break; }
      case 'export': {
        if (!W) { toast('ゲームが始まっていません', 'err'); break; }
        let text = ''; try { text = C.compressB64(C.serialize(W)); } catch (e) { toast('書き出せませんでした: ' + (e && e.message), 'err'); break; }
        st.modal = null; openModal({kind: 'export', text}); break;
      }
      case 'import': st.modal = null; openModal({kind: 'import'}); break;
      case 'import-go': { const ta = $('imp'); loadText(ta ? ta.value : ''); break; }
      case 'copy': {
        const ta = $('exp'); if (!ta) break;
        const done = () => toast('コピーしました', 'ok');
        try { if (win.navigator.clipboard && win.navigator.clipboard.writeText) { win.navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); toast('選択しました（コピーしてください）', 'ok'); }); break; } } catch (e) { /* fall through */ }
        ta.select(); try { doc.execCommand('copy'); done(); } catch (e) { toast('選択しました（コピーしてください）', 'ok'); }
        break;
      }
      case 'newgame': {
        const go = () => { st.W = null; st.speed = 0; schedule(); st.modal = null; st.seed = newSeed(); refreshSaves(); renderModal(); if (win.location.hash && win.location.hash !== '#home') goHash('#home'); renderAll(); };
        if (W && !(W.flags.gameOver && !W.flags.sandbox)) { st.pending = {ui: go}; st.prevModal = null; st.modal = null; openModal({kind: 'confirm', text: '今のゲームを終えてタイトルに戻りますか？（自動セーブは残ります。新しいゲームを始めると上書きされます）'}); }
        else go();
        break;
      }
      case 'start': startGame(); break;
      case 'devtoggle': st.dev = !st.dev; try { if (st.dev) win.localStorage.setItem(U.DEV_KEY, '1'); else win.localStorage.removeItem(U.DEV_KEY); } catch (e) { /* this visit only */ } renderAll(); break;
      default: break;
    }
  }
  // events
  doc.addEventListener('click', (e) => {
    const el = e.target && e.target.closest ? e.target.closest('[data-act],[data-ui]') : null;
    const a = !el && e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (a && st.modal && modalEl.contains(a) && st.modal.kind !== 'gameover' && st.modal.kind !== 'growth') { closeModal(); return; }   // UX-03: a link in a modal leaves it (the item stays 未決)
    if (!el) {
      if (e.target === modalEl && st.modal && st.modal.kind !== 'gameover') { if (st.modal.kind === 'confirm' && st.prevModal) { st.modal = st.prevModal; st.prevModal = null; renderModal(); } else closeModal(); }
      return;
    }
    if (el.disabled) return;
    if (el.hasAttribute('data-ui')) { if (el.tagName !== 'A') e.preventDefault(); uiCmd(el.getAttribute('data-ui'), el, e); return; }
    e.preventDefault();
    onAct(el);
  });
  doc.addEventListener('toggle', (e) => { const dd = e.target; if (dd && dd.tagName === 'DETAILS' && dd.open) fillLazy(dd); }, true);
  doc.addEventListener('click', (e) => {                            // fill before the details opens, so the form is there on the first frame
    const sm = e.target && e.target.closest ? e.target.closest('details[data-lazy] > summary') : null;
    if (sm) fillLazy(sm.parentNode);
  }, true);
  doc.addEventListener('change', (e) => {
    const el = e.target; if (!el || !el.name) return;
    const k = fieldKey(el); if (k && !el.hasAttribute('data-change')) st.dirty[k] = el.type === 'checkbox' || el.type === 'radio' ? el.checked : el.value;
    if (el.hasAttribute('data-change') && st.W) {
      const args = parseArgs(el.getAttribute('data-args')); setPath(args, el.name, U.typed(el.value, el.getAttribute('data-t') || ''));
      runAct(el.getAttribute('data-change'), U.prepareArgs(el.getAttribute('data-change'), args), el);
    }
  });
  doc.addEventListener('input', (e) => {
    const el = e.target; if (!el) return;
    if (el.hasAttribute && el.hasAttribute('data-filter')) { applyFilter(el); return; }
    const k = el.name ? fieldKey(el) : null; if (k && el.type !== 'checkbox') st.dirty[k] = el.value;
  });
  doc.addEventListener('focusout', () => { win.setTimeout(() => { if (st.viewStale) { const ae = doc.activeElement; if (!(ae && view.contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))) renderView(); } }, 0); });
  doc.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && st.modal && st.modal.kind !== 'gameover') { e.preventDefault(); uiCmd('close', modalEl, e); return; }
    const tg = doc.activeElement ? doc.activeElement.tagName : '';
    if ((e.code === 'Space' || e.key === ' ') && st.W && !st.modal && !/^(INPUT|SELECT|TEXTAREA|BUTTON|A|SUMMARY)$/.test(tg)) { e.preventDefault(); setSpeed(st.speed ? 0 : 1); }
  });
  win.addEventListener('hashchange', () => {                        // a new screen the player opened closes the modal (UX-03); the economic end and the rules choice stay
    const coded = st.codeNav !== null && win.location.hash === st.codeNav; st.codeNav = null;
    if (!coded && st.modal && st.modal.kind !== 'gameover' && st.modal.kind !== 'growth') { st.pending = null; closeModal(); }
    if (coded && !st.viewStale && st.lastRoute === route().hash) return;   // the game already drew this screen; a second innerHTML here could swallow the next click
    renderTop(); renderView(true);
  });
  win.addEventListener('pagehide', () => autosave(true));
  doc.addEventListener('visibilitychange', () => { if (doc.visibilityState === 'hidden') autosave(true); });
  if (mq) { const h = () => { if (st.theme === 'auto') renderAll(); }; if (mq.addEventListener) mq.addEventListener('change', h); else if (mq.addListener) mq.addListener(h); }
  win.setInterval(() => { if (st.W && doc.visibilityState !== 'hidden' && (st.speed > 0 || st.floaters.length) && $('cv')) drawCanvas(); }, 500);   // optional idle frames
  // boot
  let th = null; try { th = win.localStorage.getItem(U.THEME_KEY); } catch (e) { th = null; }
  applyTheme(th, false);
  try { st.dev = win.localStorage.getItem(U.DEV_KEY) === '1'; } catch (e) { st.dev = false; }
  if (/[?&]dev\b/.test(String(win.location.search || '') + '&' + String(win.location.hash || '').replace(/^#[^?]*\?/, '&'))) st.dev = true;
  refreshSaves();
  st.seed = isNum(opts.seed) ? opts.seed : newSeed();
  if (opts.world) st.W = opts.world;
  renderAll();
  return st;
};
})(CH);

</script>
<script src="avatars/game-avatars.js"></script>
<script src="avatars/ui.js"></script>
<script type="module" src="avatars/render.mjs"></script>
<script>
(function () {
  try {
    if (typeof CH !== 'undefined' && CH.ui && typeof CH.ui.mount === 'function') CH.ui.mount();
    else document.getElementById('view').textContent = 'UIモジュールを読み込めませんでした。';
  } catch (e) {
    document.getElementById('view').textContent = '起動エラー: ' + (e && e.message);
    if (typeof console !== 'undefined') console.error(e);
  }
})();
</script>
